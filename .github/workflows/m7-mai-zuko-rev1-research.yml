name: M7 Deck 32 Mai and Zuko Rev1 exact owner review
on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m7-mai-zuko-rev1-research.yml
      - data/grixis/m7/candidate_lists/Mai_and_Zuko_chatgpt_rev1.txt
      - data/grixis/m7/baseline_sources/Mai_and_Zuko_chatgpt_rev1_baseline.txt
      - data/grixis/m7/decision_reviews/Mai_and_Zuko_chatgpt_rev1*
      - data/grixis/m7/research_challengers/Mai_and_Zuko_ChatGPT_Rev1_Oracle_Index_20261025.json
      - tests/test_m7_mai_zuko_rev1_exact.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-owner-proposed-100:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install schema and test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Show exact engineering commit
        run: git rev-parse HEAD
      - name: Validate decisive seven-swap full 100 review schema
        run: python scripts/grixis_m7_decision_gate.py --check --file data/grixis/m7/decision_reviews/Mai_and_Zuko_chatgpt_rev1.json
      - name: Validate raw hashes, deck delta, full Oracle index, combo rules
        run: python -m pytest -v tests/test_m7_mai_zuko_rev1_exact.py
      - name: Preserve strict M6 Pass C source integrity
        run: python scripts/grixis_m6_bundle_check.py --check
