name: M6 Abaddon Ignus physical cascade first-hit
on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m6-abaddon-ignus-cascade-first-hit.yml
      - data/grixis/m6/phase_b_plans/abaddon_ignus_cascade_first_hit_20261021.json
      - scripts/grixis_m6_abaddon_ignus_cascade_first_hit.py
      - tests/test_m6_abaddon_ignus_cascade_first_hit.py
      - data/grixis/m6/phase_b_bounded/abaddon_ignus_cascade_first_hit_20261021.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cascade-physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Exact pull request checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test real-card MV and physical cascade exile/cast windows
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_ignus_cascade_first_hit.py' -v
      - name: Execute paired frozen first-hit distributions
        run: python scripts/grixis_m6_abaddon_ignus_cascade_first_hit.py --out abaddon_ignus_first_hit_receipt.json
      - name: Fail closed on imaginary ramp, wins and milestone certification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/grixis/m6/phase_b_plans/abaddon_ignus_cascade_first_hit_20261021.json').read_text())
          r=json.loads(Path('abaddon_ignus_first_hit_receipt.json').read_text())
          t=json.loads(Path('data/grixis/milestone_m6_m7_subtracker.json').read_text())
          assert r['canonical_approved_sha256']==p['canonical_raw_sha256']
          assert r['samples_per_physical_variant']==2000
          assert len(r['variants'])==5
          assert r['physical_lower_mv_pool']=={'count':35,'mv0':7,'mv1':15,'mv2':13}
          assert r['conditional_rules']['suspend_ancestral']['chosen_cast_from_exile']
          assert r['conditional_rules']['suspend_profane']['chosen_cast_from_exile']
          assert not r['conditional_rules']['flusterstorm_only_ignus']['legal_to_cast']
          assert not r['conditional_rules']['swan_song_only_ignus']['chosen_cast_from_exile']
          assert r['conditional_rules']['pact_of_negation_only_ignus']['legal_to_cast']
          assert not r['conditional_rules']['pact_of_negation_only_ignus']['chosen_cast_from_exile']
          assert not r['conditional_rules']['rule_of_law']['chosen_cast_from_exile']
          assert not r['conditional_rules']['drannith']['chosen_cast_from_exile']
          for k,v in r['bounds'].items():
              if k=='actual_win_rate': assert v is None
              elif k in ('m6_certificates','m7_owner_approvals'): assert v==0
              else: assert v is False, (k,v)
          assert t['m6']['gates'][5]['status']=='PARTIAL'
          assert t['m6']['gates'][6]['status']=='PARTIAL'
          assert t['m6']['formal_m6_certified_decks']==0
          assert t['m7']['formal_m7_review_decisions']==0
          print('PASS: bounded physical cascade offers no Phase B or deck approval.')
          PY
      - name: Archive exact physical first-hit evidence
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-first-cascade-hit-receipt
          path: abaddon_ignus_first_hit_receipt.json
          retention-days: 30
