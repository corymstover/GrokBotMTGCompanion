name: M7 Deck 30 Lord Xander the Collector research candidate (focused)
on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m7-lord-xander-the-collector.yml
      - data/grixis/registry.json
      - data/grixis/schemas/**
      - data/grixis/m7/**
      - data/grixis/m6/**
      - scripts/grixis_authority.py
      - scripts/grixis_m6_bundle_check.py
      - scripts/grixis_m7_decision_gate.py
      - tests/test_m7_lord_xander_the_collector_candidate.py
      - tests/test_m6_lord_xander_the_collector_m7_mechanics.py
      - tests/test_m6_lord_xander_the_collector_m7_ij.py
      - tests/test_m6_pass_c_corpus_stabilization.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lord-xander-the-collector-m7:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline validators
        run: python -m pip install --disable-pip-version-check jsonschema pytest
      - name: Record exact head
        run: git rev-parse HEAD
      - name: Deck 30 M7 gate research candidate (three swaps, research only blocked by the Stage A seal mismatch, commander first, hashes, staged alternatives, no approval)
        run: python -m pytest -v tests/test_m7_lord_xander_the_collector_candidate.py
      - name: Deck 30 Oracle-anchored rules, Persist versus Necromancy versus Goryo grid, Greaves versus Boots grid, Bog versus Malakir grid, goldfish cells and combo counts
        run: python -m pytest -v tests/test_m6_lord_xander_the_collector_m7_mechanics.py
      - name: Deck 30 candidate-specific I/J hash binding, blocked certificate, J checker rejects only on the Stage A seal, Pass C wording
        run: python -m pytest -v tests/test_m6_lord_xander_the_collector_m7_ij.py
      - name: Shared Pass C corpus stabilization (fail-closed, 60 of 62 pass, decks 30 and 31 rejected)
        run: python -m pytest -v tests/test_m6_pass_c_corpus_stabilization.py
      - name: All M7 packets structural gate with sources
        run: python scripts/grixis_m7_decision_gate.py --check --check-sources
      - name: M6 J standard bundle checker (stabilized Pass C corpus checker)
        run: python scripts/grixis_m6_bundle_check.py --check
