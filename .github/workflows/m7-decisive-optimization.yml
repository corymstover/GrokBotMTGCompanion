name: M7 decisive commander-first optimization contract
on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m7-decisive-optimization.yml
      - AGENTS.md
      - grixis/M6 Commander-First Single-Deck Review Standard.md
      - grixis/Commander-First Decisive Optimization and Test Economy Standard.md
      - data/grixis/registry.json
      - grixis/decks/**
      - exports/grixis-archidekt/source-baseline/**
      - data/grixis/schemas/m7_decisive_optimization.schema.json
      - data/grixis/m7/decision_reviews/**
      - data/grixis/m7/owner_approvals/**
      - data/grixis/m7/candidate_lists/**
      - data/grixis/m7/research_challengers/**
      - tests/test_m7_admiral_stage6_decision_bound.py
      - tests/test_m7_admiral_edhrec_stage4_packages.py
      - tests/test_m7_admiral_edhrec_inclusion_lift.py
      - tests/test_m7_admiral_post_floor_oracle_paid_effects.py
      - tests/test_m7_admiral_unbounded_stage1.py
      - tests/test_m7_admiral_evasion_horizon_stage2.py
      - scripts/grixis_m7_decision_gate.py
      - scripts/grixis_m7_abaddon_live_oracle.py
      - scripts/grixis_m7_abaddon_rev2_live_oracle.py
      - scripts/grixis_m6_abaddon_oracle_capture.py
      - tests/test_m6_abaddon_saved_oracle_snapshot.py
      - tests/test_m6_abaddon_final_ij.py
      - scripts/grixis_m6_abaddon_i_final_check.py
      - data/grixis/m6/bundles/**
      - data/grixis/m6/ij/certificates/**
      - data/grixis/m6/rules_snapshots/**
      - data/grixis/m6/oracle_snapshots/**
      - tests/test_m7_abaddon_live_oracle.py
      - tests/test_m7_abaddon_rev2_six_swap.py
      - tests/test_m6_abaddon_rev2_new_effects_p0.py
      - tests/test_m6_abaddon_rev2_permanent_oracle.py
      - tests/test_m6_abaddon_rev2_candidate_bound_ij.py
      - tests/test_m7_abaddon_rev2_owner_ready.py
      - tests/test_m7_abaddon_owner_approval_receipt.py
      - tests/test_m7_abaddon_decisive_cut_disposition.py
      - tests/test_m6_abaddon_betrayal_keeper_p0.py
      - tests/test_m6_abaddon_call_forth_p0.py
      - tests/test_m6_abaddon_betrayal_suspend_p0.py
      - tests/test_m6_abaddon_breach_led_freeze_p0.py
      - tests/test_m6_abaddon_wild_magic_p0.py
      - tests/test_m6_abaddon_nalfeshnee_p0.py
      - tests/test_m6_abaddon_archaeologist_p0.py
      - tests/test_m6_abaddon_prosper_p0.py
      - tests/test_m6_abaddon_storm_kiln_p0.py
      - tests/test_m6_abaddon_minds_desire_p0.py
      - tests/test_m6_abaddon_threshold_doublers_p0.py
      - tests/test_m6_abaddon_residual_p1.py
      - tests/test_m6_abaddon_remaining_p1.py
      - tests/test_m6_abaddon_scope_adjudication.py
      - data/grixis/m6/phase_b_plans/abaddon_p0_threshold_doublers_20261022.json
      - tests/test_m6_abaddon_final_choice.py
      - tests/test_m7_abaddon_final_staged_packet.py
      - tests/test_m6_abaddon_j_candidate_inputs.py
      - scripts/grixis_m6_abaddon_j_candidate_inputs.py
      - data/grixis/m6/phase_b_plans/abaddon_p0_minds_desire_20261022.json
      - data/grixis/m6/phase_b_plans/abaddon_p0_storm_kiln_20261022.json
      - data/grixis/m6/phase_b_plans/abaddon_p0_prosper_20261022.json
      - data/grixis/m6/phase_b_plans/abaddon_p0_archaeologist_20261022.json
      - data/grixis/m6/phase_b_plans/abaddon_p0_nalfeshnee_20261022.json
      - data/grixis/m6/phase_b_plans/abaddon_p0_wild_magic_20261022.json
      - data/grixis/m6/phase_b_plans/abaddon_p0_breach_led_freeze_20261022.json
      - data/grixis/m6/phase_b_plans/abaddon_p0_betrayal_suspend_20261022.json
      - data/grixis/m6/phase_b_plans/abaddon_p0_call_forth_20261022.json
      - scripts/grixis_m6_abaddon_p0_replay.py
      - scripts/grixis_m6_abaddon_preflight.py
      - tests/test_m6_abaddon_preflight.py
      - scripts/grixis_m6_abaddon_i_blocked.py
      - tests/test_m6_abaddon_i_blocked.py
      - data/grixis/m6/certification_preflight/**
      - data/grixis/m6/phase_b_plans/abaddon_p0_theft_keeper_diff_20261022.json
      - data/grixis/m6/phase_b_plans/abaddon_p0_case_inventory_20261022.json
      - tests/test_m7_decisive_optimization_gate.py
      - tests/test_m7_abaddon_research_challengers.py
      - tests/test_m7_abaddon_oracle_erratum_v2.py
      - tests/test_m6_abaddon_lost_keeper_effect.py
      - data/grixis/m6/phase_b_plans/abaddon_lost_keeper_effect_20261022.json
      - data/grixis/m6/phase_b_bounded/abaddon_lost_keeper_effect_20261022.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-bound-m7-owner-candidate-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline structural schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Adjudicate Admiral stage6 blocker-thresholds and opposite evasion cases
        run: python -m unittest discover -s tests -p 'test_m7_admiral_stage6_decision_bound.py' -v
      - name: Verify 8/9-swap EDHREC full-100 research options and finite adverse combat
        run: python -m unittest discover -s tests -p 'test_m7_admiral_edhrec_stage4_packages.py' -v
      - name: Verify Admiral EDHREC discovery beyond original candidate pools
        run: python -m unittest discover -s tests -p 'test_m7_admiral_edhrec_inclusion_lift.py' -v
      - name: Verify Admiral post-floor eleven sourced cards and paid combat effects
        run: python -m unittest discover -s tests -p 'test_m7_admiral_post_floor_oracle_paid_effects.py' -v
      - name: Exercise adversarial no-wasted-testing and final candidate guards
        run: python -m unittest discover -s tests -p 'test_m7_decisive_optimization_gate.py' -v
      - name: Verify exact preferred Abaddon 100-card 2-swap against approved source and preserve M6 blockers
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_final_choice.py' -v
      - name: Run source-bound staged Abaddon M7 100-card owner packet tests
        run: python -m unittest discover -s tests -p 'test_m7_abaddon_final_staged_packet.py' -v
      - name: Verify candidate-specific mana, authored four red-team answers, and owner-waived Pass C provenance without M6 J certification
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_j_candidate_inputs.py' -v
      - name: Build exact-head Abaddon J inputs partial hash crosswalk
        run: python -m scripts.grixis_m6_abaddon_j_candidate_inputs --out "${{ runner.temp }}/abaddon-m6-j-candidate-inputs-partial.json"
      - name: Retain non-certifying Abaddon candidate J input source hashes and limitations
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-m6-j-inputs-partial-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/abaddon-m6-j-candidate-inputs-partial.json
          if-no-files-found: error
          retention-days: 60
      - name: Validate Abaddon source-derived three-portfolio physical alternatives
        run: python -m unittest discover -s tests -p 'test_m7_abaddon_research_challengers.py' -v
      - name: Enforce corrected Abaddon Oracle source facts and four exact v2 challengers
        run: python -m unittest discover -s tests -p 'test_m7_abaddon_oracle_erratum_v2.py' -v
      - name: Verify three revised Abaddon physical 100-card portfolios, six true swaps and finite direct interactions
        run: python -m unittest discover -s tests -p 'test_m7_abaddon_rev2_six_swap.py' -v
      - name: Execute 12 bounded physical Abaddon v2 clone, Bowmasters, Rift and combat step fixtures
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_rev2_new_effects_p0.py' -v
      - name: Check permanent complete Abaddon rev2 100-card Oracle proofs and exact three logical hashes
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_rev2_permanent_oracle.py' -v
      - name: Verify revised Abaddon I-J candidate sidecars and keep owner packet blocked until formal adoption
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_rev2_candidate_bound_ij.py' -v
      - name: Verify six-swap owner-ready M7 revision against physical full-100, strict source-bound I-J, Oracle, and preserved rejected history
        run: python -m unittest discover -s tests -p 'test_m7_abaddon_rev2_owner_ready.py' -v
      - name: Bind Cory's exact Abaddon M7 approval and canonical merge hash without accepting unfinished milestones
        run: python -m unittest discover -s tests -p 'test_m7_abaddon_owner_approval_receipt.py' -v
      - name: Test exact physical Ignus cascade Lost/Keeper response and fetch payoffs
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_lost_keeper_effect.py' -v
      - name: Verify fail-closed Oracle/source guards offline
        run: python -m unittest discover -s tests -p 'test_m7_abaddon_live_oracle.py' -v
      - name: Enforce semantic zero-improvement I PASS contract beyond permissive generic schema branches
        run: python -m scripts.grixis_m6_abaddon_i_final_check --check
      - name: Validate chosen-source Abaddon final M6 I and J evidence against strict schemas and SHA bindings
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_final_ij.py' -v
      - name: Verify all committed complete J bundles without implying owner approval
        run: python scripts/grixis_m6_bundle_check.py --check
      - name: Verify permanent 97-name Oracle archive and exact research candidate logical hash
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_saved_oracle_snapshot.py' -v
      - name: Fetch current Scryfall Oracle and Commander legality for five complete Abaddon lists
        run: python -m scripts.grixis_m7_abaddon_live_oracle --out "${{ runner.temp }}/abaddon-m7-current-scryfall.json"
      - name: Emit exact 97-name public Oracle rows and chosen 100-card logical hash for durable M6 J archival
        run: python -m scripts.grixis_m6_abaddon_oracle_capture --oracle "${{ runner.temp }}/abaddon-m7-current-scryfall.json"
      - name: Preserve full source-bound current Oracle proof as immutable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-m7-oracle-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/abaddon-m7-current-scryfall.json
          if-no-files-found: error
          retention-days: 60
      - name: Live Scryfall audit of all 100 revised Abaddon research names across three physical packages
        run: python -m scripts.grixis_m7_abaddon_rev2_live_oracle --out "${{ runner.temp }}/abaddon-m7-rev2-current-scryfall.json"
      - name: Preserve candidate-specific revised Abaddon Oracle proof without reusing historical I-J hashes
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-m7-rev2-oracle-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/abaddon-m7-rev2-current-scryfall.json
          if-no-files-found: error
          retention-days: 60
      - name: Verify Abaddon whole-deck keeper-versus-betrayal authored decision and exact source deltas
        run: python -m unittest discover -s tests -p 'test_m7_abaddon_decisive_cut_disposition.py' -v
      - name: Run six new physically conserved Betrayal and Keeper P0 tests
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_betrayal_keeper_p0.py' -v
      - name: Run eight source-paid Call Forth MV8 physical triple cascade tests
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_call_forth_p0.py' -v
      - name: Test seven Inevitable Betrayal paid suspend and upkeep-to-exile cases
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_betrayal_suspend_p0.py' -v
      - name: Test nine source-paid Breach LED Brain Freeze physical escape and storm cases
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_breach_led_freeze_p0.py' -v
      - name: Test eight registered source-paid Wild-Magic Sorcerer first-exile nested cascade cases
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_wild_magic_p0.py' -v
      - name: Test nine physical Nalfeshnee copies, original casts and end-step sacrifice cases
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_nalfeshnee_p0.py' -v
      - name: Test ten source-paid Passionate Archaeologist owned-commander targeted exile triggers
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_archaeologist_p0.py' -v
      - name: Test ten Prosper exile-cast, land-play, paid impulse and expiry rules cases
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_prosper_p0.py' -v
      - name: Test seven Storm-Kiln magecraft physical source and virtual spell copy cases
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_storm_kiln_p0.py' -v
      - name: Test seven real Mind's Desire storm copies paid casts and deferred exile-play cases
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_minds_desire_p0.py' -v
      - name: Test nine source-paid Bloodletter/Solphim damage-life replacement interactions
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_threshold_doublers_p0.py' -v
      - name: Execute seven source-paid residual P1 tests for threshold burn, cast pingers, Vivi and Noise Marine
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_residual_p1.py' -v
      - name: Verify seven physical residual P1 cases for exile blast and conditional cost/impulse
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_remaining_p1.py' -v
      - name: Validate decision-scoped Abaddon M6.6 and M6.7 completion is not M6 certification
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_scope_adjudication.py' -v
      - name: Replay all 104 actual named Abaddon P0 tests with fail-closed inventory
        run: python -m scripts.grixis_m6_abaddon_p0_replay --out "${{ runner.temp }}/abaddon-m6-p0-actual-replay.json"
      - name: Upload separate P0 actual-execution receipts with remaining-case disclosure
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-m6-p0-partial-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/abaddon-m6-p0-actual-replay.json
          if-no-files-found: error
          retention-days: 60
      - name: Check authored M6.6 M6.7 evidence preflight and failure cases offline
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_preflight.py' -v
      - name: Bind sealed A B, waived Pass C, 104 real P0 executions, 97 live Oracle names into one pre-certification receipt
        run: |
          python -m scripts.grixis_m6_abaddon_preflight \
            --p0 "${{ runner.temp }}/abaddon-m6-p0-actual-replay.json" \
            --oracle "${{ runner.temp }}/abaddon-m7-current-scryfall.json" \
            --out "${{ runner.temp }}/abaddon-m6-precert-integrity.json"
      - name: Preserve Abaddon integrity preflight without claiming final M6 J
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-m6-precert-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/abaddon-m6-precert-integrity.json
          if-no-files-found: error
          retention-days: 60
      - name: Confirm explicitly BLOCKED M6 I certificate matches unresolved P0 and unapproved options
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_i_blocked.py' -v
      - name: Generate schema-valid but non-certifying Abaddon M6 I blocked receipt
        run: python -m scripts.grixis_m6_abaddon_i_blocked --out "${{ runner.temp }}/abaddon-m6-i-blocked.json"
      - name: Preserve truthful BLOCKED M6 I receipt
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-m6-i-blocked-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/abaddon-m6-i-blocked.json
          if-no-files-found: error
          retention-days: 60
      - name: Validate Admiral second-horizon complete 100-card evasion research options
        run: python -m unittest discover -s tests -p 'test_m7_admiral_evasion_horizon_stage2.py' -v
      - name: Validate Admiral open-ended six- and seven-swap physical research fixtures
        run: python -m unittest discover -s tests -p 'test_m7_admiral_unbounded_stage1.py' -v
      - name: Validate all submitted M7 decisions and staged exact 100-card decks
        run: python scripts/grixis_m7_decision_gate.py --check --check-sources
      - name: Verify authoritative 62-roster and no auto-approval
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('data/grixis/registry.json').read_text())
          tracker=json.loads(Path('data/grixis/milestone_m6_m7_subtracker.json').read_text())
          assert len(reg['decks']) == 62
          assert tracker['m6']['formal_m6_certified_decks'] == 0
          assert tracker['m7']['formal_m7_review_decisions'] == 0
          print('PASS: M7 strategy packets are structurally gated; no canonical deck edits or owner approvals inferred.')
          PY
