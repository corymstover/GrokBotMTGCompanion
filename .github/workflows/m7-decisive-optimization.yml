name: M7 decisive commander-first optimization contract
on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m7-decisive-optimization.yml
      - AGENTS.md
      - grixis/M6 Commander-First Single-Deck Review Standard.md
      - grixis/Commander-First Decisive Optimization and Test Economy Standard.md
      - data/grixis/registry.json
      - grixis/decks/**
      - exports/grixis-archidekt/source-baseline/**
      - data/grixis/schemas/m7_decisive_optimization.schema.json
      - data/grixis/m7/decision_reviews/**
      - data/grixis/m7/candidate_lists/**
      - data/grixis/m7/research_challengers/**
      - scripts/grixis_m7_decision_gate.py
      - scripts/grixis_m7_abaddon_live_oracle.py
      - tests/test_m7_abaddon_live_oracle.py
      - tests/test_m7_abaddon_decisive_cut_disposition.py
      - tests/test_m6_abaddon_betrayal_keeper_p0.py
      - tests/test_m6_abaddon_call_forth_p0.py
      - tests/test_m6_abaddon_betrayal_suspend_p0.py
      - tests/test_m6_abaddon_breach_led_freeze_p0.py
      - tests/test_m6_abaddon_wild_magic_p0.py
      - tests/test_m6_abaddon_nalfeshnee_p0.py
      - tests/test_m6_abaddon_archaeologist_p0.py
      - data/grixis/m6/phase_b_plans/abaddon_p0_archaeologist_20261022.json
      - data/grixis/m6/phase_b_plans/abaddon_p0_nalfeshnee_20261022.json
      - data/grixis/m6/phase_b_plans/abaddon_p0_wild_magic_20261022.json
      - data/grixis/m6/phase_b_plans/abaddon_p0_breach_led_freeze_20261022.json
      - data/grixis/m6/phase_b_plans/abaddon_p0_betrayal_suspend_20261022.json
      - data/grixis/m6/phase_b_plans/abaddon_p0_call_forth_20261022.json
      - scripts/grixis_m6_abaddon_p0_replay.py
      - scripts/grixis_m6_abaddon_preflight.py
      - tests/test_m6_abaddon_preflight.py
      - scripts/grixis_m6_abaddon_i_blocked.py
      - tests/test_m6_abaddon_i_blocked.py
      - data/grixis/m6/certification_preflight/**
      - data/grixis/m6/phase_b_plans/abaddon_p0_theft_keeper_diff_20261022.json
      - data/grixis/m6/phase_b_plans/abaddon_p0_case_inventory_20261022.json
      - tests/test_m7_decisive_optimization_gate.py
      - tests/test_m7_abaddon_research_challengers.py
      - tests/test_m7_abaddon_oracle_erratum_v2.py
      - tests/test_m6_abaddon_lost_keeper_effect.py
      - data/grixis/m6/phase_b_plans/abaddon_lost_keeper_effect_20261022.json
      - data/grixis/m6/phase_b_bounded/abaddon_lost_keeper_effect_20261022.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-bound-m7-owner-candidate-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline structural schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Exercise adversarial no-wasted-testing and final candidate guards
        run: python -m unittest discover -s tests -p 'test_m7_decisive_optimization_gate.py' -v
      - name: Validate Abaddon source-derived three-portfolio physical alternatives
        run: python -m unittest discover -s tests -p 'test_m7_abaddon_research_challengers.py' -v
      - name: Enforce corrected Abaddon Oracle source facts and four exact v2 challengers
        run: python -m unittest discover -s tests -p 'test_m7_abaddon_oracle_erratum_v2.py' -v
      - name: Test exact physical Ignus cascade Lost/Keeper response and fetch payoffs
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_lost_keeper_effect.py' -v
      - name: Verify fail-closed Oracle/source guards offline
        run: python -m unittest discover -s tests -p 'test_m7_abaddon_live_oracle.py' -v
      - name: Fetch current Scryfall Oracle and Commander legality for five complete Abaddon lists
        run: python -m scripts.grixis_m7_abaddon_live_oracle --out "${{ runner.temp }}/abaddon-m7-current-scryfall.json"
      - name: Preserve full source-bound current Oracle proof as immutable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-m7-oracle-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/abaddon-m7-current-scryfall.json
          if-no-files-found: error
          retention-days: 60
      - name: Verify Abaddon whole-deck keeper-versus-betrayal authored decision and exact source deltas
        run: python -m unittest discover -s tests -p 'test_m7_abaddon_decisive_cut_disposition.py' -v
      - name: Run six new physically conserved Betrayal and Keeper P0 tests
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_betrayal_keeper_p0.py' -v
      - name: Run eight source-paid Call Forth MV8 physical triple cascade tests
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_call_forth_p0.py' -v
      - name: Test seven Inevitable Betrayal paid suspend and upkeep-to-exile cases
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_betrayal_suspend_p0.py' -v
      - name: Test nine source-paid Breach LED Brain Freeze physical escape and storm cases
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_breach_led_freeze_p0.py' -v
      - name: Test eight registered source-paid Wild-Magic Sorcerer first-exile nested cascade cases
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_wild_magic_p0.py' -v
      - name: Test nine physical Nalfeshnee copies, original casts and end-step sacrifice cases
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_nalfeshnee_p0.py' -v
      - name: Test ten source-paid Passionate Archaeologist owned-commander targeted exile triggers
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_archaeologist_p0.py' -v
      - name: Replay all 71 actual named Abaddon P0 tests with fail-closed inventory
        run: python -m scripts.grixis_m6_abaddon_p0_replay --out "${{ runner.temp }}/abaddon-m6-p0-actual-replay.json"
      - name: Upload separate P0 actual-execution receipts with remaining-case disclosure
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-m6-p0-partial-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/abaddon-m6-p0-actual-replay.json
          if-no-files-found: error
          retention-days: 60
      - name: Check authored M6.6 M6.7 evidence preflight and failure cases offline
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_preflight.py' -v
      - name: Bind sealed A B, waived Pass C, 71 real P0 executions, 97 live Oracle names into one pre-certification receipt
        run: |
          python -m scripts.grixis_m6_abaddon_preflight \
            --p0 "${{ runner.temp }}/abaddon-m6-p0-actual-replay.json" \
            --oracle "${{ runner.temp }}/abaddon-m7-current-scryfall.json" \
            --out "${{ runner.temp }}/abaddon-m6-precert-integrity.json"
      - name: Preserve Abaddon integrity preflight without claiming final M6 J
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-m6-precert-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/abaddon-m6-precert-integrity.json
          if-no-files-found: error
          retention-days: 60
      - name: Confirm explicitly BLOCKED M6 I certificate matches unresolved P0 and unapproved options
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_i_blocked.py' -v
      - name: Generate schema-valid but non-certifying Abaddon M6 I blocked receipt
        run: python -m scripts.grixis_m6_abaddon_i_blocked --out "${{ runner.temp }}/abaddon-m6-i-blocked.json"
      - name: Preserve truthful BLOCKED M6 I receipt
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-m6-i-blocked-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/abaddon-m6-i-blocked.json
          if-no-files-found: error
          retention-days: 60
      - name: Validate all submitted M7 decisions and staged exact 100-card decks
        run: python scripts/grixis_m7_decision_gate.py --check --check-sources
      - name: Verify authoritative 62-roster and no auto-approval
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('data/grixis/registry.json').read_text())
          tracker=json.loads(Path('data/grixis/milestone_m6_m7_subtracker.json').read_text())
          assert len(reg['decks']) == 62
          assert tracker['m6']['formal_m6_certified_decks'] == 0
          assert tracker['m7']['formal_m7_review_decisions'] == 0
          print('PASS: M7 strategy packets are structurally gated; no canonical deck edits or owner approvals inferred.')
          PY
