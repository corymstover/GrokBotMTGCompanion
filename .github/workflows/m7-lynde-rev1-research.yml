name: M7 Deck 31 Lynde Rev1 source-paid preapproval research
on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m7-lynde-rev1-research.yml
      - data/grixis/m7/candidate_lists/Lynde__Cheerful_Tormentor_chatgpt_rev1.txt
      - data/grixis/m7/baseline_sources/Lynde__Cheerful_Tormentor_chatgpt_rev1_baseline.txt
      - data/grixis/m7/decision_reviews/Lynde__Cheerful_Tormentor_chatgpt_rev1_review.md
      - data/grixis/m7/research_challengers/Lynde__Cheerful_Tormentor_ChatGPT_Rev1_Oracle_Index_20261025.json
      - data/grixis/m7/research_challengers/Lynde__Cheerful_Tormentor_ChatGPT_Rev1_Alternatives_20261025.json
      - tests/test_m7_lynde_rev1_exact.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-paid-precertification:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Record exact engineering commit
        run: git rev-parse HEAD
      - name: Run 13 blueprint case groups and structural tests on the exact proposed SHA
        run: python -m pytest -v tests/test_m7_lynde_rev1_exact.py
      - name: Preserve the unresolved seal and missing full Oracle-ID gate
        run: python -m pytest -v tests/test_m7_lynde_rev1_exact.py -k uncertified
