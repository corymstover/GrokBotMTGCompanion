name: "M7 Deck 56 Madcap Jester Rev1 exact-source certification"

on:
  pull_request:
    paths:
      - "data/grixis/m7/candidate_lists/The_Madcap_Jester_M7_Rev1*.txt"
      - "data/grixis/m7/madcap_jester_rev1/**"
      - "data/grixis/m7/decision_reviews/The_Madcap_Jester*"
      - ".github/workflows/m7-deck56-madcap-jester-rev1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-public-oracle-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Deck 56 pinned baseline, 7 swaps, two larger 100s and 24 bounded cases"
        run: python3 data/grixis/m7/madcap_jester_rev1/verify.py
      - name: "Download pinned public Scryfall Oracle bulk feed by GET only"
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            -H 'User-Agent: GrixisCommanderEncyclopedia/1.0' \
            -o "$RUNNER_TEMP/oracle-2026-10-27.jsonl.gz" \
            'https://data.scryfall.io/oracle-cards/oracle-cards-20261027210243.jsonl.gz'
      - name: "Local 102-card Oracle, UBR identity, 98 legal plus two named exceptions"
        run: python3 data/grixis/m7/madcap_jester_rev1/verify.py --oracle-file "$RUNNER_TEMP/oracle-2026-10-27.jsonl.gz"
      - name: "Install M7 structural schema validator"
        run: python3 -m pip install jsonschema
      - name: "Full 99-slot audit, 23 judgments and seven real swaps"
        run: python3 scripts/grixis_m7_decision_gate.py --check --file data/grixis/m7/decision_reviews/The_Madcap_Jester_rev1.json
      - name: "Repository-wide M7 structural regression"
        run: python3 scripts/grixis_m7_decision_gate.py --check
