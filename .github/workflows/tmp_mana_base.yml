name: tmp Step C mana baseline
on:
  push:
    branches: [chatgpt-cycle68-1-mana-baseline]
permissions:
  contents: write
jobs:
  mana:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCRYFALL_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle68-1-mana-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema pytest
      - name: Semantic tests
        run: pytest -q tests/test_mana_base.py
      - name: Build and validate all 62 mana baselines
        run: |
          python scripts/grixis_mana_base.py --build
          python scripts/grixis_mana_base.py --check
          python scripts/grixis_mana_base.py --summary
      - name: Commit generated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grixis/mana_base
          if ! git diff --cached --quiet; then
            git commit -m "ChatGPT cycle 68.1: generate 62 mana-base baselines [skip ci]"
            git push
          fi
