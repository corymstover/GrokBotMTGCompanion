name: ChatGPT tutor-module sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'chatgpt-cycle66-8-tutors'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCRYFALL_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Apply audited tutor corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/grixis_mech/tutors.py')
          s = p.read_text()
          s = s.replace('MILL = re.compile(r"\\bmill (a|an|one|two|three|four|five|six|seven|eight|nine|ten|\\d+) cards?\\b", re.I)',
                        'MILL = re.compile(r"\\bmills? (a|an|one|two|three|four|five|six|seven|eight|nine|ten|\\d+) cards?\\b", re.I)')
          old = '''        mm = MILL.search(sent)\n        if mm:\n            mode, why = _mode(sent, type_line, mm.start())\n            if not mode:\n                reasons.append(why)\n                continue\n            return {"kind": "mill", "mode": mode, "amount": _num(mm.group(1))}, None\n'''
          new = '''        mm = MILL.search(sent)\n        if mm:\n            pre = sent[:mm.start()].lower()\n            if re.search(r"(?:target|each) (?:player|opponent)|(?:an|each) opponent", pre):\n                reasons.append("opponent/other-player mill is not modelled as self graveyard setup")\n                continue\n            mode, why = _mode(sent, type_line, mm.start())\n            if not mode:\n                reasons.append(why)\n                continue\n            return {"kind": "mill", "mode": mode, "amount": _num(mm.group(1))}, None\n'''
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit('mill parser signature changed; refusing blind edit')
          s = s.replace('if re.search(r"search your library[^.]{0,100}graveyard|\\bmill\\b|\\bsurveil\\b", t, re.I):',
                        'if re.search(r"search your library[^.]{0,100}graveyard|\\bmills?\\b|\\bsurveils?\\b", t, re.I):')
          old = '''    for _, tr in games:\n        prev, arrival, k = set(), None, 0\n        for s in tr:\n            if s["turn"] > T:\n                break\n            here = n in s.get("battlefield", [])\n            if here and arrival is None:\n                arrival = s["turn"]\n            if rule["mode"] == "upkeep":\n                k += 1 if n in prev else 0\n            elif here:\n                cost = rule["cost"]\n                if cost["tap"] and creature and s["turn"] == arrival:\n                    pass\n                elif _unspent(s) >= cost["mana"]:\n                    k += 1\n            prev = set(s.get("battlefield", []))\n        total += k\n'''
          new = '''    for _, tr in games:\n        prev, k = set(), 0\n        for s in tr:\n            if s["turn"] > T:\n                break\n            here = n in s.get("battlefield", [])\n            arrived = here and n not in prev\n            if rule["mode"] == "upkeep":\n                # End-step trace cannot prove a trigger if the card vanished during the turn; require it before and after.\n                k += 1 if here and n in prev else 0\n            elif here:\n                cost = rule["cost"]\n                if cost["tap"] and creature and arrived:\n                    pass  # summoning sickness resets on every re-entry\n                elif _unspent(s) >= cost["mana"]:\n                    k += 1\n            prev = set(s.get("battlefield", []))\n        total += k\n'''
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit('repeatable_uses signature changed; refusing blind edit')
          p.write_text(s)

          p = Path('tests/test_mech_tutor_semantics.py')
          s = p.read_text().replace('{2}, {T}: Target player mills two cards.', '{2}, {T}: Mill two cards.')
          p.write_text(s)
          PY
      - name: Regenerate mechanic registry
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / 'scripts'))
          import grixis_mech as gm
          from grixis_mech import router
          p = root / 'data/grixis/mechanics/modules.json'
          d = json.loads(p.read_text(encoding='utf-8'))
          d['framework_version'] = gm.FRAMEWORK_VERSION
          d['modules'] = gm.registry()
          d['planned_families'] = sorted(k for k in router.PLANNED if k not in gm.MODULES)
          p.write_text(json.dumps(d, indent=1, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - run: python -m pytest -q tests/test_mech_attack_semantics.py tests/test_mech_recursion_semantics.py tests/test_mech_stack_semantics.py tests/test_mech_cost_semantics.py tests/test_mech_tutor_semantics.py
      - run: python scripts/grixis_mechanics.py --check
      - name: Commit audited/generated changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/grixis_mech/tutors.py tests/test_mech_tutor_semantics.py data/grixis/mechanics/modules.json
            git commit -m "Fix tutor semantics and regenerate mechanic registry"
            git push origin HEAD:${{ github.head_ref }}
          fi
