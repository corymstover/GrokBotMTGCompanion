name: M7 Deck 28 Loki the Deceiver research candidate (focused)
on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m7-loki-the-deceiver.yml
      - data/grixis/registry.json
      - data/grixis/schemas/**
      - data/grixis/m7/**
      - data/grixis/m6/**
      - scripts/grixis_authority.py
      - scripts/grixis_m6_bundle_check.py
      - scripts/grixis_m7_decision_gate.py
      - tests/test_m7_loki_the_deceiver_candidate.py
      - tests/test_m6_loki_the_deceiver_m7_mechanics.py
      - tests/test_m6_loki_the_deceiver_m7_ij.py
      - tests/test_m6_pass_c_corpus_stabilization.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loki-the-deceiver-m7:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline validators
        run: python -m pip install --disable-pip-version-check jsonschema pytest
      - name: Record exact head
        run: git rev-parse HEAD
      - name: Deck 28 M7 gate research candidate (two swaps, research only blocked, commander first, hashes, staged alternatives, no approval)
        run: python -m pytest -v tests/test_m7_loki_the_deceiver_candidate.py
      - name: Deck 28 Oracle-anchored rules, enters versus attack triggers, bounded Pass C Strionic and Seize grid, goldfish cells and combo delta
        run: python -m pytest -v tests/test_m6_loki_the_deceiver_m7_mechanics.py
      - name: Deck 28 candidate-specific I/J hash binding, J checker and Pass C wording
        run: python -m pytest -v tests/test_m6_loki_the_deceiver_m7_ij.py
      - name: Shared Pass C corpus stabilization (fail-closed, 60 of 62 pass, decks 30 and 31 rejected)
        run: python -m pytest -v tests/test_m6_pass_c_corpus_stabilization.py
      - name: All M7 packets structural gate with sources
        run: python scripts/grixis_m7_decision_gate.py --check --check-sources
      - name: M6 J standard bundle checker (stabilized Pass C corpus checker)
        run: python scripts/grixis_m6_bundle_check.py --check
