name: M6 targeted Abaddon Neheb-Assault Phase B fixture
on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m6-abaddon-neheb-assault.yml
      - data/grixis/m6/phase_b_plans/abaddon_neheb_assault_20261021.json
      - scripts/grixis_m6_abaddon_neheb_assault.py
      - tests/test_m6_abaddon_neheb_assault.py
      - data/grixis/m6/phase_b_bounded/abaddon_neheb_assault_20261021.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  neheb-assault-rules-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run bounded effect-aware adversarial mechanics cases
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_neheb_assault.py' -v
      - name: Assert no automated certification or canonical list changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('data/grixis/m6/phase_b_plans/abaddon_neheb_assault_20261021.json').read_text())
          tracker=json.loads(Path('data/grixis/milestone_m6_m7_subtracker.json').read_text())
          assert all(not v for v in plan['authority'].values())
          assert plan['baseline_deck_status']=='APPROVED_LOCKED_UNCHANGED'
          assert tracker['m6']['formal_m6_certified_decks']==0
          assert tracker['m7']['formal_m7_review_decisions']==0
          assert tracker['m6']['gates'][5]['status']=='PARTIAL'
          print('PASS: deterministic rules fixture does not certify Phase B, deck replacement, or milestone.')
          PY
