name: ChatGPT cycle 84 - Abaddon registered mana-pair evidence
on:
  push:
    branches:
      - chatgpt-cycle84-abaddon-mana-pair
    paths:
      - .github/workflows/chatgpt-cycle84-mana-pair.yml
      - scripts/grixis_m6_abaddon_mana_pair.py
      - data/grixis/m6/phase_b_plans/abaddon_chrome_mox_pair_01.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: c84-m6-abaddon-pair
  cancel-in-progress: true
jobs:
  paired-mana:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle84-abaddon-mana-pair
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run strictly pre-registered identical-seed one-swap mana evidence
        run: python scripts/grixis_m6_abaddon_mana_pair.py --build --check
      - name: No canonical or approval changes
        run: |
          git diff --name-only HEAD
          if git diff --name-only HEAD | grep -Ev '^data/grixis/m6/phase_b_bounded/' | grep -q .; then
            echo 'Unexpected authority or canonical path modified' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/grixis/registry.json').read_text())
          x=json.loads(Path('data/grixis/m6/phase_b_bounded/abaddon_mana_pair_chrome_mox.json').read_text())
          assert len(r['decks'])==62
          assert r['program']['milestones']['M5']['status']=='accepted'
          assert r['program']['milestones']['M6']['accepted_by'] is None
          assert x['supports_improvement_claim'] is False and x['phase_b_complete'] is False
          assert all(v is False for v in x['authority'].values())
          assert x['samples']==1000 and x['seed']==84017
          print('Paired mana endpoints only; no deck changes or approvals')
          PY
      - name: Commit registered evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/grixis/m6/phase_b_bounded/abaddon_mana_pair_chrome_mox.json
          if git diff --cached --quiet; then
            echo 'Paired evidence unchanged'
          else
            git commit -m 'Cycle 84: record exact seeded Abaddon early-mana counterfactual [skip ci]'
            git pull --rebase origin chatgpt-cycle84-abaddon-mana-pair
            git push origin HEAD:chatgpt-cycle84-abaddon-mana-pair
          fi
