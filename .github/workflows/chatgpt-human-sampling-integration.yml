name: Temporary ChatGPT Step H integration

on:
  push:
    branches: [chatgpt-cycle71-3-human-sampling-integration]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle71-3-human-sampling-integration
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Frozen sampler still validates
        run: |
          python scripts/grixis_human_sampling_policy.py --check
          python scripts/grixis_human_sampling.py --check
      - name: Build review obligations and gain proof
        run: |
          python scripts/grixis_human_review_manifest.py --build
          python scripts/grixis_human_review_manifest.py --check
          python scripts/grixis_human_sampling_gain.py --build
          python scripts/grixis_human_sampling_gain.py --check
      - name: Focused Step H tests
        run: python -m pytest -q tests/test_human_sampling_policy.py tests/test_human_sampling.py tests/test_human_sampling_step.py
      - name: Integrate Step H into validate_all and close tracker stage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=Path('scripts/validate_all.py'); t=v.read_text()
          old='             ("bracket-stress-step", ["scripts/grixis_stress_step.py", "--check"]),  # Step F: bracket-specific suites/routing/red-team/gain + local module closure\n             ("unit-tests", ["scripts/run_tests.py"]),'
          new='             ("bracket-stress-step", ["scripts/grixis_stress_step.py", "--check"]),  # Step F: bracket-specific suites/routing/red-team/gain + local module closure\n             ("human-sampling-step", ["scripts/grixis_human_sampling_step.py", "--check"]),  # Step H: frozen sampler, review obligations and oversight gain\n             ("unit-tests", ["scripts/run_tests.py"]),'
          if old not in t and 'human-sampling-step' not in t:
              raise SystemExit('validate_all insertion point not found')
          if 'human-sampling-step' not in t:
              v.write_text(t.replace(old,new))

          p=Path('data/grixis/upgrade_plan.json'); d=json.loads(p.read_text())
          s=next(x for x in d['steps'] if x['id']=='H')
          s['status']='complete'
          s['batches']=[
            '71.1 freeze pre-M6 human-sampling policy, seed, quotas, nine strata and future-result formulas with immutable hash record',
            '71.2 deterministic sampler + seven static strata selections + deduped review workload; future optimizer-disagreement/major-change functions regression-tested but remain empty before M6',
            '71.3 immutable review-obligation manifest + oversight gain proof + validate_all integration/freeze gate'
          ]
          tr=d['launch_tracker']; tr['updated']='ChatGPT cycle 71.3 (2026-10-16)'
          x=next(x for x in tr['stages'] if x['id']=='H')
          x['batches_done']=2.5; x['status']='complete'
          x['note']='Step H complete: frozen pre-M6 policy, deterministic static sampler, preregistered dynamic selectors, immutable review-obligation manifest and oversight gain/integration gate.'
          tr['batches_done']=41.5; tr['percent_complete']=66.4
          p.write_text(json.dumps(d,indent=1,ensure_ascii=False)+'\n')

          md=Path('grixis/Grixis Birthday Upgrade Plan.md'); m=md.read_text(); marker='### Step H batch 71.3: review obligations, gain proof and integration closure'
          if marker not in m:
              m += '''\n\n### Step H batch 71.3: review obligations, gain proof and integration closure\n\n- `human_review_manifest.json` converts the deterministic static sample into a frozen minimum review queue while preserving every overlap membership and the exact selection inputs that caused each deck to be selected. Every generated item is pending; scripts cannot author its judgment or satisfy Cory-only approval.\n- Dynamic optimizer-disagreement and major-change queues remain empty until their pre-registered M6 inputs exist. Their executable selectors were frozen/tested in 71.2; 71.3 only records the future obligation contract.\n- `human_sampling_gain.json` demonstrates process gain rather than deck power: deterministic preregistration now creates a minimum multi-stratum review workload, makes all exception/pending-release decks mandatory, and prevents result-aware selection formulas. Unsampled decks are explicitly not certified.\n- `grixis_human_sampling_step.py --check` is integrated into `validate_all`; it verifies the freeze hash, deterministic sampler replay, review queue, gain proof, non-decision authority and empty pre-M6 dynamic queues. Step H infrastructure is complete.\n'''
              md.write_text(m)
          PY
      - name: Validate Step H integration
        run: |
          python scripts/grixis_human_sampling_step.py --check
          python scripts/validate_all.py --only human-sampling-step
      - name: Assert development snapshot metadata unchanged
        run: git diff --exit-code HEAD -- data/grixis/dev_snapshot_lock.json
      - name: Commit generated artifacts and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-human-sampling-integration.yml
          git add data/grixis/human_review_manifest.json data/grixis/human_sampling_gain.json data/grixis/upgrade_plan.json 'grixis/Grixis Birthday Upgrade Plan.md' scripts/validate_all.py
          git commit -m "ChatGPT cycle 71.3: finalize Step H integration [skip ci]"
          git push
