name: ChatGPT cycle 90 - verify secondary mana dependencies
on:
  push:
    branches:
      - chatgpt-cycle90-mox-downstream-proofs
    paths:
      - .github/workflows/chatgpt-cycle90-mox-deps.yml
      - scripts/grixis_m6_mox_dependency_proof.py
      - tests/test_m6_mox_dependency_proof.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cycle90-mox-deps
  cancel-in-progress: true
jobs:
  dependency-equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle90-mox-downstream-proofs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate module and source boundaries
        run: python -m unittest discover -s tests -p 'test_m6_mox_dependency_proof.py' -v
      - name: Replay 75 reports from 25 affected decks; require byte-for-byte equivalence
        run: python -u scripts/grixis_m6_mox_dependency_proof.py --build --check
      - name: Prevent any writes outside M6 derived proof
        run: |
          if git diff --name-only HEAD | grep -Ev '^data/grixis/m6/mox_reconciliation/' | grep -q .; then
            echo 'forbidden historical or canonical mutation'; exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/grixis/m6/mox_reconciliation/dependency_proof.json').read_text())
          r=json.loads(Path('data/grixis/registry.json').read_text())
          assert len(r['decks'])==62
          assert r['program']['milestones']['M5']['status']=='accepted'
          assert r['program']['milestones']['M6']['accepted_by'] is None
          assert d['decks']==25 and d['verified_existing_outputs']==75
          assert not any(d['authority'].values())
          print('75/75 secondary Step C reports identical, historical authority preserved')
          PY
      - name: Commit evidence-only equivalence proof
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/grixis/m6/mox_reconciliation/dependency_proof.json
          if git diff --cached --quiet; then
            echo 'dependency proof unchanged'
          else
            git commit -m 'Cycle 90: attest exact secondary mana report equivalence [skip ci]'
            git pull --rebase origin chatgpt-cycle90-mox-downstream-proofs
            git push origin HEAD:chatgpt-cycle90-mox-downstream-proofs
          fi
