name: Phase 1B historical Duel Decks source evidence
on:
  push:
    branches: [main, chatgpt-phase1b-duel-decks-20261029]
    paths:
      - scripts/audit_duel_decks_sources.py
      - scripts/product_family_lookup.py
      - tests/test_duel_decks_sources.py
      - data/set_atlas/duel_decks_*
      - .github/workflows/phase1b-duel-decks.yml
  pull_request:
    paths:
      - scripts/audit_duel_decks_sources.py
      - scripts/product_family_lookup.py
      - tests/test_duel_decks_sources.py
      - data/set_atlas/duel_decks_*
      - .github/workflows/phase1b-duel-decks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-duel-decks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all 25 Scryfall codes against cited official products
        run: python3 -m unittest discover -s tests -p test_duel_decks_sources.py -v
      - name: Verify committed deterministic audit and offline lookup
        run: |
          python3 scripts/audit_duel_decks_sources.py
          python3 scripts/product_family_lookup.py --summary
          python3 -m py_compile scripts/audit_duel_decks_sources.py scripts/product_family_lookup.py
