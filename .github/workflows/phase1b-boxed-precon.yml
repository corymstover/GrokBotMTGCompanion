name: Phase 1B boxed preconstructed product/component evidence
on:
  push:
    branches: [main, chatgpt-phase1b-boxed-schemes-planechase-20261029]
    paths:
      - scripts/audit_boxed_precon_sources.py
      - scripts/product_family_lookup.py
      - tests/test_boxed_precon_sources.py
      - data/set_atlas/boxed_precon_*
      - .github/workflows/phase1b-boxed-precon.yml
  pull_request:
    paths:
      - scripts/audit_boxed_precon_sources.py
      - scripts/product_family_lookup.py
      - tests/test_boxed_precon_sources.py
      - data/set_atlas/boxed_precon_*
      - .github/workflows/phase1b-boxed-precon.yml
permissions:
  contents: write
jobs:
  boxed-and-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify boxed product and separate card-component evidence
        run: python3 -m unittest discover -s tests -p test_boxed_precon_sources.py -v
      - name: Generate derived index on authorized research branch only
        if: github.event_name == 'push' && github.ref_name == 'chatgpt-phase1b-boxed-schemes-planechase-20261029'
        run: python3 scripts/audit_boxed_precon_sources.py --write
      - name: Check deterministic bytes and current 86/762 offline lookup
        run: |
          python3 scripts/audit_boxed_precon_sources.py
          python3 scripts/product_family_lookup.py --summary
          python3 -m py_compile scripts/audit_boxed_precon_sources.py scripts/product_family_lookup.py
      - name: Publish exactly regenerated source-branch report
        if: github.event_name == 'push' && github.ref_name == 'chatgpt-phase1b-boxed-schemes-planechase-20261029'
        run: |
          git add data/set_atlas/boxed_precon_source_audit_2026-10-29.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Phase 1B: publish 15 boxed product and gameplay component source classifications"
            git push origin HEAD:chatgpt-phase1b-boxed-schemes-planechase-20261029
          fi
