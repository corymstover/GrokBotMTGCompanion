  workflow_dispatch:

jobs:
  source-safe-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild and audit cited relationship graph
        run: |
          python3 scripts/build_multiverse_graph.py --check
          python3 scripts/audit_entity_structures.py --check
      - name: Confidence and graph regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_mv_ask*.py' -q
          python3 -m unittest discover -s tests -p 'test_graph_integrity_post_grok.py' -q
          python3 -m unittest discover -s tests -p 'test_graph_display_name_variants.py' -q
          python3 -m unittest discover -s tests -p 'test_printing_card_representations.py' -q
          python3 -m unittest discover -s tests -p 'test_phase1b_snapshot_cache_diagnostics.py' -q
      - name: Current progress checkpoint, read-only release dry run and representative queries
        run: |
          python3 scripts/update_multiverse_progress_tracker.py --check
          python3 -m unittest discover -s tests -p 'test_multiverse_progress_tracker.py' -q
          python3 scripts/certification_dry_run.py --check
          python3 scripts/batch_recount.py
      - name: Phase 2–6 history coverage and chronology proof gates
        run: |
          python3 scripts/query_lore_chronology.py --check
          python3 scripts/build_plane_history_priorities.py --check
          python3 scripts/build_plane_history_dossiers.py --check
          python3 -m unittest discover -s tests -p 'test_plane_history_dossiers.py' -q
          python3 scripts/build_story_coverage_inventory.py --check
          python3 scripts/audit_lore_pack_c5.py --check
          python3 scripts/audit_lore_pack_alara.py --check
          python3 scripts/audit_lore_pack_theros_profile.py --check
          python3 scripts/audit_lore_plane_history_batch.py --check
          python3 scripts/audit_lore_bloomburrow_duskmourn.py --check
          python3 scripts/build_in_universe_dates.py --check
          python3 scripts/build_claim_card_anchors.py --check
          python3 -m unittest discover -s tests -p 'test_lore_pack_c5_invasion_outcome.py' -q
          python3 -m unittest discover -s tests -p 'test_lore_pack_alara.py' -q
          python3 -m unittest discover -s tests -p 'test_lore_pack_theros_profile.py' -q
          python3 -m unittest discover -s tests -p 'test_lore_plane_history_batch.py' -q
          python3 -m unittest discover -s tests -p 'test_lore_bloomburrow_duskmourn.py' -q
          python3 -m unittest discover -s tests -p 'test_claim_card_anchors.py' -q
          python3 -m unittest discover -s tests -p 'test_phase5_chronology_coverage.py' -q
          python3 scripts/audit_lore_pilot.py
      - name: Offline update-monitor parser and baseline integrity
        run: |
          python3 scripts/monitor_multiverse_updates.py --validate
          python3 -m unittest discover -s tests -p 'test_multiverse_update_monitor.py' -q
