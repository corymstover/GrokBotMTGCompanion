name: M7 Admiral Beckett Brass research-only package contract

on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m7-admiral-beckett-research-contract.yml
      - data/grixis/m6/authority_snapshots/Admiral_Beckett_Brass_Canonical_Approved_20261022.txt
      - data/grixis/m6/phase_b_plans/admiral_beckett_candidate_D_effect_coverage_20261022.json
      - data/grixis/m6/ij/tested_pools/Admiral_Beckett_Brass_candidate_D_20261022.json
      - data/grixis/m6/ij/certificates/admiral-beckett-brass.json
      - data/grixis/m6/certification_preflight/Admiral_M6_J_candidate_D_*.md
      - data/grixis/m6/certification_preflight/Admiral_M6_I_four_package_effect_adjudication_20261022.md
      - data/grixis/m6/certification_preflight/Admiral_M6_6_7_Gate_Adjudication_20261022.md
      - data/grixis/m6/certification_preflight/Admiral_M6_I_Tested_Pool_Closure_20261022.md
      - data/grixis/m6/rules_snapshots/Admiral_Beckett_Brass_20261022_Rules_Sources.md
      - data/grixis/m6/bundles/admiral-beckett-brass.json
      - data/grixis/m7/research_challengers/Admiral_Beckett_Brass_*.txt
      - data/grixis/m7/research_challengers/Admiral_Beckett_Brass_*.json
      - data/grixis/m7/research_challengers/Admiral_Beckett_Brass_*.md
      - tests/test_m7_admiral_edhrec_inclusion_lift.py
      - tests/test_m7_admiral_post_floor_oracle_paid_effects.py
      - tests/test_m7_admiral_beckett_research_packages.py
      - tests/test_m7_admiral_beckett_full_source_and_resilience.py
      - tests/test_m6_admiral_beckett_pirate_density_candidate_turn4.py
      - tests/test_m6_admiral_beckett_candidate_d_changed_effects.py
      - tests/test_m7_admiral_beckett_material_decisions.py
      - tests/test_m6_admiral_beckett_candidate_d_adversarial.py
      - tests/test_m6_admiral_beckett_ij_preflight.py
      - tests/test_m6_admiral_beckett_pool_effect_comparison.py
      - tests/test_m6_admiral_beckett_j_bundle.py
      - tests/test_m6_bundle_check.py
  workflow_dispatch:

jobs:
  source_bound_research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 100-card alternatives, Oracle research, and fail-closed research status
        run: python -m unittest discover -s tests -p 'test_m7_admiral_beckett_research_packages.py' -v
      - name: Verify Admiral EDHREC high-lift discovery and no fake owner promotion
        run: python -m unittest discover -s tests -p 'test_m7_admiral_edhrec_inclusion_lift.py' -v
      - name: Verify new post-floor sourced Oracle cards and paid adversarial combat effects
        run: python -m unittest discover -s tests -p 'test_m7_admiral_post_floor_oracle_paid_effects.py' -v
      - name: Verify all 121 Oracle sources and resilient package combat assumptions
        run: python -m unittest discover -s tests -p 'test_m7_admiral_beckett_full_source_and_resilience.py' -v
      - name: Verify exact physical Pirate-density candidate four-turn mana and theft fixture
        run: python -m unittest discover -s tests -p 'test_m6_admiral_beckett_pirate_density_candidate_turn4.py' -v
      - name: Check changed Pirate effects, Malcolm counters, and paid Broadside boast
        run: python -m unittest discover -s tests -p 'test_m6_admiral_beckett_candidate_d_changed_effects.py' -v
      - name: Verify all 24 researched strategic dispositions and exact five selected replacements
        run: python -m unittest discover -s tests -p 'test_m7_admiral_beckett_material_decisions.py' -v
      - name: Verify candidate D versus actual incumbent losses and hostile blocker states
        run: python -m unittest discover -s tests -p 'test_m6_admiral_beckett_candidate_d_adversarial.py' -v
      - name: Verify exact A/B/C/D candidate hashes and truthful incomplete M6 I status
        run: python -m unittest discover -s tests -p 'test_m6_admiral_beckett_ij_preflight.py' -v
      - name: Compare A/B/C/D real Pirate package effects and lost engine costs
        run: python -m unittest discover -s tests -p 'test_m6_admiral_beckett_pool_effect_comparison.py' -v
      - name: Recompute exact Admiral J candidate hash and authority limitations
        run: python -m unittest discover -s tests -p 'test_m6_admiral_beckett_j_bundle.py' -v
      - name: Reject fabricated Pass C technical independence and validate actual Admiral waiver
        run: python -m unittest discover -s tests -p 'test_m6_bundle_check.py' -v
      - name: Verify all committed J bundles against sealed A/B, waived Pass C and Phase B bytes
        run: python scripts/grixis_m6_bundle_check.py --check
