name: Temporary ChatGPT Step D integration

on:
  push:
    branches: [chatgpt-cycle69-3-commander-integration]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCRYFALL_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle69-3-commander-integration
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Focused Step D tests
        run: python -m pytest -q tests/test_commander_structure.py tests/test_commander_counterfactual.py tests/test_commander_marginal.py
      - name: Validate schemas and build gain proof
        run: |
          python - <<'PY'
          import json,jsonschema
          for p in ('data/grixis/schemas/commander_marginal.schema.json','data/grixis/schemas/commander_marginal_gain.schema.json'):
              jsonschema.Draft202012Validator.check_schema(json.load(open(p)))
          PY
          python scripts/grixis_commander_marginal_gain.py --build
          python scripts/grixis_commander_marginal_gain.py --check
          python scripts/grixis_commander_step.py --check
      - name: Wire validate_all and update plan
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('scripts/validate_all.py'); text=p.read_text()
          anchor='             ("mana-step", ["scripts/grixis_mana_step.py", "--check"]),  # Step C: cache-independent layers + explicit 68.3 pending/validated closure\n'
          ins='             ("commander-step", ["scripts/grixis_commander_step.py", "--check"]),  # Step D: structural/integration layers + explicit local dynamic closure\n'
          if ins not in text:
              if anchor not in text: raise SystemExit('validate_all Step C anchor missing')
              text=text.replace(anchor,anchor+ins); p.write_text(text)

          up=Path('data/grixis/upgrade_plan.json'); d=json.loads(up.read_text())
          s=next(x for x in d['steps'] if x['id']=='D'); s['status']='code_complete_pending_local_cache_validation'; s['batches']=[
            '69.1 structural commander marginality: Blueprint routes, engines/packages and Step-B combo route dependence',
            '69.2 paired counterfactual simulator architecture: normal / unavailable / +2 tax / bounded removal-disruption proxy; synthetic validation complete, real 62 outputs pending frozen local cache',
            '69.3 marginal-value vector integration + real structural gain proof + validate_all gate; code complete, dynamic 62-deck generation/integration pending frozen local cache'
          ]
          tr=d['launch_tracker']; tr['updated']='ChatGPT cycle 69.3 (2026-10-16)'
          x=next(x for x in tr['stages'] if x['id']=='D'); x['batches_done']=3; x['status']='code_complete_pending_local_cache_validation'; x['note']='3/3.5 batch-equivalents complete. Structural, paired counterfactual, non-scoring marginal vector and integration gate are implemented. Remaining 0.5 equivalent = frozen-local-cache 62-deck dynamic generation + marginal integration validation.'
          tr['batches_done']=35; tr['percent_complete']=56.0
          up.write_text(json.dumps(d,indent=1,ensure_ascii=False)+'\n')

          md=Path('grixis/Grixis Birthday Upgrade Plan.md'); t=md.read_text(); marker='### Step D batch 69.3: marginal-value integration and gain proof'
          if marker not in t:
              t += '''\n\n### Step D batch 69.3: marginal-value integration and gain proof\n\n- `scripts/grixis_commander_marginal.py` keeps Commander Marginal Value dimensions separate: strategic routes/engines, card economy, mana utilization, first key-set access, combo access, meaningful-progress vector and recovery. No scalar commander-value score exists.\n- Meaningful actions are represented as a vector of interpretable progress components rather than summing heterogeneous events. This avoids fake precision while still exposing commander-sensitive action/progress deltas once local dynamic records exist.\n- `commander_marginal_gain.json` demonstrates real structural decision-resolution gain on project decks while explicitly marking real dynamic gain as pending frozen-local-cache generation.\n- `scripts/grixis_commander_step.py --check` is the Step D closure gate: 62 structural records are mandatory; 0 dynamic records is an explicit pending state, 1–61 is invalid, and 62 counterfactual + 62 marginal records are required for full Step D closure.\n- `validate_all` now includes `commander-step`. Step D is code-complete pending the declared local dynamic generation/validation item.\n'''
              md.write_text(t)
          PY
      - name: Validate integrated Step D gate
        run: python scripts/validate_all.py --only commander-step
      - name: Assert snapshot metadata unchanged
        run: git diff --exit-code HEAD -- data/grixis/dev_snapshot_lock.json
      - name: Commit integration outputs and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-commander-integration-build.yml
          git add scripts/validate_all.py data/grixis/commander_marginal_gain.json data/grixis/upgrade_plan.json 'grixis/Grixis Birthday Upgrade Plan.md'
          git commit -m "ChatGPT cycle 69.3: finalize Step D integration [skip ci]"
          git push
