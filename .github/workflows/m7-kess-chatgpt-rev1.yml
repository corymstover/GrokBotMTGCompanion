name: M7 Deck 26 Kess ChatGPT independent Rev1 five-swap review

on:
  pull_request:
    branches: [grokbot-deck26-kess-dissident-mage-m7-20261023]
    paths:
      - .github/workflows/m7-kess-chatgpt-rev1.yml
      - data/grixis/m7/independent_reviews/Kess__Dissident_Mage_ChatGPT_Rev1_candidate.txt
      - data/grixis/m7/independent_reviews/Kess__Dissident_Mage_ChatGPT_Rev1_review.md
      - data/grixis/m7/decision_reviews/Kess__Dissident_Mage_rev1.json
      - data/grixis/m7/candidate_lists/Kess__Dissident_Mage_ChatGPT_Rev1*.txt
      - data/grixis/m6/oracle_snapshots/Kess__Dissident_Mage_M7_Scryfall_20261023.json
      - tests/test_m7_kess_chatgpt_rev1.py
      - tests/test_m6_kess_rev1_case_transfer.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kess-rev1-exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record exact head
        run: git rev-parse HEAD
      - name: Install decision-packet validation dependency
        run: python -m pip install 'jsonschema>=4,<5'
      - name: Verify exact 100, SHA, five swaps, current sourced Commander legality and mechanics, no authority changes
        run: python -m unittest discover -s tests -p test_m7_kess_chatgpt_rev1.py -v
      - name: Execute all fourteen source-bound Kess M6-transfer mechanical cases
        run: python -m unittest discover -s tests -p test_m6_kess_rev1_case_transfer.py -v
      - name: Validate decisive M7 Rev1 packet and full-deck staged challenger audit
        run: python scripts/grixis_m7_decision_gate.py --check --file data/grixis/m7/decision_reviews/Kess__Dissident_Mage_rev1.json
