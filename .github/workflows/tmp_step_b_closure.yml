name: tmp Step B closure
on:
  push:
    branches: [chatgpt-cycle67-5-step-b-closure]
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCRYFALL_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle67-5-step-b-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema pytest
      - name: Patch Combo Quality checker for non-deck gain artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/grixis_combo_quality.py'); s=p.read_text()
          old='present = {p.stem for p in OUT.glob("*.json") if p.name != "summary.json"}'
          new='present = {p.stem for p in OUT.glob("*.json") if p.name not in ("summary.json", "decision_quality_gain.json")}'
          if old in s: s=s.replace(old,new)
          elif new not in s: raise SystemExit('combo-quality coverage expression changed unexpectedly')
          p.write_text(s)
          PY
      - name: Integrate Step B checks into validate_all
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate_all.py'); s=p.read_text()
          needle='             ("mechanics", ["scripts/grixis_mechanics.py", "--check"]),  # Bot cycle 66.1 (step E): mechanic module registry  # Bot cycle 65.1 (step A): saturation certificates  # Bot cycle 64.1 (G0): sealed benchmark corpus\n             ("unit-tests", ["scripts/run_tests.py"]),'
          replacement='             ("mechanics", ["scripts/grixis_mechanics.py", "--check"]),  # Step E mechanic module registry\n             ("combo-quality", ["scripts/grixis_combo_quality.py", "--check"]),  # Step B: per-line quality vectors\n             ("power-core", ["scripts/grixis_power_core.py", "--check"]),  # Step B / D5 overlay\n             ("combo-line-semantics", ["scripts/grixis_combo_steps_quality.py", "--check"]),  # Step B: cached Spellbook line evidence\n             ("combo-families", ["scripts/grixis_combo_families.py", "--check"]),  # Step B: near-variant redundancy networks\n             ("combo-quality-gain", ["scripts/grixis_combo_quality_gain.py", "--check"]),  # Step B acceptance criterion 9\n             ("unit-tests", ["scripts/run_tests.py"]),'
          if needle in s: s=s.replace(needle,replacement)
          elif '("combo-families", ["scripts/grixis_combo_families.py", "--check"])' not in s: raise SystemExit('validate_all insertion point changed unexpectedly')
          p.write_text(s)
          PY
      - name: Build and check gain record
        run: |
          python scripts/grixis_combo_quality_gain.py --build
          python scripts/grixis_combo_quality_gain.py --check
      - name: Step B unit tests
        run: pytest -q tests/test_combo_quality.py tests/test_power_core.py tests/test_combo_line_semantics.py tests/test_combo_families.py tests/test_combo_quality_gain.py
      - name: Targeted validate_all Step B gate
        run: python scripts/validate_all.py --only combo-quality,power-core,combo-line-semantics,combo-families,combo-quality-gain
      - name: Update machine plan and tracker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/grixis/upgrade_plan.json'); d=json.loads(p.read_text())
          by={x['id']:x for x in d['steps']}
          e=by['E']
          extra=['66.5a attack-trigger semantic audit','66.5b graveyard-recursion semantic audit','66.6 counterspell and stack-protection readiness','66.7 X-spell capacity and alternate-cost semantics','66.8 graveyard setup and repeatable tutors','66.9 bounded opponent-dependent draw','66.10 category-specific stax/tax proxy','66.11 LED/Breach startup-resource semantics','66.12 bounded table life-loss and discard-pressure semantics','66.13 residual/judgment routing closure (no fake generic simulator for residual or commander-specific text)']
          for x in extra:
              if x not in e['batches']: e['batches'].append(x)
          e['status']='code_complete_pending_local_cache_validation'
          e['validation_gate']='Full legacy mechanics coverage/examples rebuild and final real-deck/full validate_all require the frozen local Scryfall cache. Code-level module/routing semantics are closed; do not mark Step E fully validated until the local gate passes.'
          e['implemented_modules']=['activated_engines','alternate_costs','attack_trigger_proxy','cast_triggers','counterspell_density','death_triggers','discard','graveyard_recursion','graveyard_tutoring','led_breach_sequences','life_loss','opponent_dependent_draw','repeatable_draw','repeatable_tutors','sacrifice_additional_cost','sacrifice_costs','self_recursion','stack_protection','stax_tax','token_makers','x_spells']
          e['routing_closure']={'genuine_planned_module_families_remaining':0,'residual_review_families':['death_other','sacrifice_other','tokens_other'],'commander_specific_policy':'Commander-specific hooks remain Commander-first judgment / Step D unless a bounded dedicated module exists.'}
          cq=json.loads(Path('data/grixis/combo_quality/summary.json').read_text())['totals']
          pc=json.loads(Path('data/grixis/power_core/summary.json').read_text())['totals']
          ls=json.loads(Path('data/grixis/combo_line_semantics/summary.json').read_text())['totals']
          cf=json.loads(Path('data/grixis/combo_families/summary.json').read_text())['totals']
          b=by['B']; b['batches']=['67.1 combo-quality evidence vectors across all 62 decks','67.2 D5 power_core overlay + materiality gate','67.3 Commander Spellbook line-semantics evidence','67.4 combo near-variant redundancy-family synthesis','67.5 validate_all integration + decision-quality gain proof + Step B closure']; b['status']='complete'; b['artifacts']=['data/grixis/combo_quality/','data/grixis/combo_line_semantics/','data/grixis/combo_families/','data/grixis/power_core/','data/grixis/combo_quality/decision_quality_gain.json']; b['metrics']={'spellbook_lines':cq['combo_count'],'infinite_lines':cq['infinite_count'],'blueprint_win_linked_lines':cq['blueprint_win_linked_count'],'direct_commander_piece_lines':cq['commander_piece_count'],'commander_independent_win_hints':cq['commander_independent_win_hint_count'],'compact_power_core_candidates':pc['compact_candidate_count'],'step_records':ls['step_record_found_count'],'declared_mana_records':ls['mana_needed_declared_count'],'zone_mentions':ls['zone_mention_count'],'direct_endpoint_hints':ls['direct_endpoint_hint_count'],'variant_families':cf['family_count'],'multi_line_variant_families':cf['multi_line_family_count'],'strategic_priority_auto_decisions':0}; b['next']='Step C mana-base optimizer; Step B evidence remains provisional and decision-bearing combo priority waits for judgment/M6.'
          tr=d['launch_tracker']; tr['updated']='ChatGPT cycle 67.5 (2026-10-16)'; st={x['id']:x for x in tr['stages']}; st['E'].update({'estimated_batches':16,'batches_done':15,'status':'code_complete_pending_local_cache_validation','note':'15 engineering batches/sub-batches complete through 66.13; reserve 1 batch-equivalent for frozen-cache coverage/examples rebuild + full local validation.'}); st['B'].update({'estimated_batches':5,'batches_done':5,'status':'complete','note':'took 5 ChatGPT batches (67.1-67.5): 62-deck vectors, D5 overlay, line semantics, variant families, integration/gain proof.'}); tr['total_estimated_batches']=sum(float(x['estimated_batches']) for x in tr['stages']); tr['batches_done']=sum(float(x['batches_done']) for x in tr['stages']); tr['percent_complete']=round(100*tr['batches_done']/tr['total_estimated_batches'],1)
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          print('Birthday Launch',tr['batches_done'],'/',tr['total_estimated_batches'],'=',tr['percent_complete'],'%')
          PY
      - name: Update Birthday Plan prose
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('grixis/Grixis Birthday Upgrade Plan.md'); s=p.read_text()
          old_e='| 3 | **E** mechanic test modules (sim v1.2) | 10–14 | A | dev | Priority by `not_modelable` counts (9,040 / 25,940 swaps in the stored files; 9,044 was the cycle-61 figure, see `data/grixis/mechanics/not_modelable_reconciliation.json`). Opponent-facing parts as bounded proxies (decision 4). v1.0/v1.1 stay runnable. |'
          new_e='| 3 | **E** mechanic test modules (sim v1.2) | 10–14 est. (15 engineering batches/sub-batches so far) | A | dev | **Code-complete through 66.13; local frozen-cache validation still required.** 21 bounded modules; residual death/sacrifice/token wording and commander-specific hooks remain explicit judgment/not-modelable rather than fake generic simulation. v1.0/v1.1 stay runnable. |'
          old_b='| 4 | **B** combo quality model + `power_core` backfill overlay | 4–6 | E | dev | Backfill follows decision 5 (overlay + materiality gate). |'
          new_b='| 4 | **B** combo quality model + `power_core` backfill overlay | 4–6 (took 5: 67.1–67.5) | E | dev | **Complete as evidence infrastructure.** Quality vectors, D5 overlay, cached line semantics and near-variant family networks are integrated; all strategic priority remains unresolved for judgment. |'
          if old_e in s: s=s.replace(old_e,new_e)
          if old_b in s: s=s.replace(old_b,new_b)
          marker='\n## Step B completion — ChatGPT cycles 67.1–67.5\n'
          if marker not in s:
              s += marker + '''\nStep B is complete as **evidence infrastructure**, not as a deck decision. It records all frozen Commander Spellbook lines with quality vectors, D5 `power_core` review overlays, cached community line semantics, and deterministic near-variant redundancy networks. Variant families explicitly warn that transitive membership is not strategic equivalence. The D5 overlay changes no accepted M2 Blueprint field and requests no automatic M2 reopen.\n\nThe demonstrated-gain record shows materially finer decision resolution than binary combo presence while preserving **zero automatic primary/secondary/backup/incidental/value-loop priority decisions**. Exact/colored mana remains Step C; commander marginal value remains Step D; final priority remains judgment/M6.\n\nStep E is code-closed through 66.13 but still waits on one local frozen-cache rebuild/full-validation gate before it is called fully validated.\n'''
          p.write_text(s)
          PY
      - name: Commit closure artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/grixis_combo_quality.py scripts/validate_all.py data/grixis/upgrade_plan.json 'grixis/Grixis Birthday Upgrade Plan.md' data/grixis/combo_quality/decision_quality_gain.json
          if ! git diff --cached --quiet; then
            git commit -m "ChatGPT cycle 67.5: integrate and close Step B [skip ci]"
            git push
          fi
