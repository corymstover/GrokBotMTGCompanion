name: Temporary Step B combo-quality build

on:
  push:
    branches: [chatgpt-cycle67-1-combo-quality]

permissions:
  contents: write

jobs:
  build-combo-quality:
    if: ${{ !contains(github.event.head_commit.message, 'sync generated combo-quality artifacts') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle67-1-combo-quality
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Patch schema resolver to use the local common schema
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/grixis_combo_quality.py")
          s = p.read_text()
          old = '''    schema = load(SCHEMA)\n    resolver = jsonschema.RefResolver(base_uri=SCHEMA.resolve().as_uri(), referrer=schema)\n    validator = jsonschema.Draft202012Validator(schema, resolver=resolver)\n'''
          new = '''    schema = load(SCHEMA)\n    common_path = SCHEMA.parent / "common.schema.json"\n    common = load(common_path)\n    store = {schema["$id"]: schema, common["$id"]: common}\n    resolver = jsonschema.RefResolver(base_uri=schema["$id"], referrer=schema, store=store)\n    validator = jsonschema.Draft202012Validator(schema, resolver=resolver)\n'''
          if old not in s:
              raise SystemExit("expected resolver block not found")
          p.write_text(s.replace(old, new))
          PY

      - name: Run combo-quality unit tests
        run: python -m pytest -q tests/test_combo_quality.py

      - name: Build all 62 combo-quality records
        run: python scripts/grixis_combo_quality.py --build

      - name: Validate combo-quality records
        run: python scripts/grixis_combo_quality.py --check

      - name: Show Abaddon worked example
        run: python scripts/grixis_combo_quality.py --show abaddon-the-despoiler 1368-3518-4856

      - name: Commit generated artifacts and resolver fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/grixis_combo_quality.py data/grixis/combo_quality
          if git diff --cached --quiet; then
            echo "Combo-quality artifacts already current."
          else
            git commit -m "ChatGPT: sync generated combo-quality artifacts"
            git push origin HEAD:chatgpt-cycle67-1-combo-quality
          fi
