name: Phase 1B Wizards reprint and curated products
on:
  push:
    branches:
      - main
      - chatgpt-phase1b-reprint-curated-source-batch-20261029
    paths:
      - scripts/audit_reprint_curated_sources.py
      - scripts/product_family_lookup.py
      - tests/test_reprint_curated_sources.py
      - data/set_atlas/reprint_curated_*
      - .github/workflows/phase1b-reprint-curated.yml
  pull_request:
    paths:
      - scripts/audit_reprint_curated_sources.py
      - scripts/product_family_lookup.py
      - tests/test_reprint_curated_sources.py
      - data/set_atlas/reprint_curated_*
      - .github/workflows/phase1b-reprint-curated.yml
permissions:
  contents: write
jobs:
  source-backed-28-products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source, conservation, source-grade and lookup regression tests
        run: python3 -m unittest discover -s tests -p 'test_reprint_curated_sources.py' -v
      - name: Generate derived report only on source research branch
        if: github.event_name == 'push' && github.ref_name == 'chatgpt-phase1b-reprint-curated-source-batch-20261029'
        run: python3 scripts/audit_reprint_curated_sources.py --write
      - name: Replay report, lookup and syntax
        run: |
          python3 scripts/audit_reprint_curated_sources.py
          python3 scripts/product_family_lookup.py --summary
          python3 -m py_compile scripts/audit_reprint_curated_sources.py scripts/product_family_lookup.py
      - name: Publish reproducible report without modifying frozen input snapshots
        if: github.event_name == 'push' && github.ref_name == 'chatgpt-phase1b-reprint-curated-source-batch-20261029'
        run: |
          git add data/set_atlas/reprint_curated_source_audit_2026-10-29.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Phase 1B: publish 28 graded reprint and curated-product sources"
            git push origin HEAD:chatgpt-phase1b-reprint-curated-source-batch-20261029
          fi
