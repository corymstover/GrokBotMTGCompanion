name: M6 Admiral Beckett Brass finite P1 tranche 2
on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m6-admiral-beckett-p1-tranche2.yml
      - tests/test_m6_admiral_beckett_brass_p1_tranche2.py
      - tests/test_m6_admiral_beckett_brass_p1_tranche1.py
      - tests/test_m6_admiral_beckett_brass_p0.py
      - data/grixis/m6/authority_snapshots/Admiral_Beckett_Brass_Canonical_Approved_20261022.txt
      - data/grixis/m6/oracle_snapshots/Admiral_Beckett_Brass_P1_Tranche2_Scryfall_20261022.json
      - data/grixis/m6/phase_b_plans/admiral_beckett_p1_tranche2_execution_20261022.json
  push:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m6-admiral-beckett-p1-tranche2.yml
      - tests/test_m6_admiral_beckett_brass_p1_tranche2.py
      - data/grixis/m6/phase_b_plans/admiral_beckett_p1_tranche2_execution_20261022.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p0-and-all-eight-p1-finite-mechanics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recheck five prior P0 cases
        run: python -m unittest discover -s tests -p 'test_m6_admiral_beckett_brass_p0.py' -v
      - name: Recheck four first-tranche P1 contracts
        run: python -m unittest discover -s tests -p 'test_m6_admiral_beckett_brass_p1_tranche1.py' -v
      - name: Test E01 E02 W01 F02 on exact canonical 100 and current named Oracle
        run: python -m unittest discover -s tests -p 'test_m6_admiral_beckett_brass_p1_tranche2.py' -v
