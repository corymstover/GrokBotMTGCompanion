name: Temporary Step B combo-step semantics build

on:
  push:
    branches: [chatgpt-cycle67-3-combo-steps]

permissions:
  contents: write

jobs:
  build-combo-steps:
    if: ${{ !contains(github.event.head_commit.message, 'sync generated combo-line semantics') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle67-3-combo-steps
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Remove redundant overwritten raw assignment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/grixis_combo_steps_quality.py")
          s = p.read_text()
          old = '''    raw = {k: r.get(k) or ([]) if k == "produces" else r.get(k) or "" for k in\n           ("mana_needed", "easy_prerequisites", "notable_prerequisites", "notes", "produces", "steps")}\n    # The dict comprehension above is intentionally replaced below for clarity around list-vs-string defaults.\n'''
          if old not in s:
              raise SystemExit("expected redundant assignment block not found")
          p.write_text(s.replace(old, ""))
          PY
      - name: Unit tests
        run: python -m pytest -q tests/test_combo_line_semantics.py
      - name: Build
        run: python scripts/grixis_combo_steps_quality.py --build
      - name: Check
        run: python scripts/grixis_combo_steps_quality.py --check
      - name: Summary
        run: python scripts/grixis_combo_steps_quality.py --summary
      - name: Commit cleaned script and generated records
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/grixis_combo_steps_quality.py data/grixis/combo_line_semantics
          if git diff --cached --quiet; then
            echo "Combo-line artifacts already current."
          else
            git commit -m "ChatGPT: sync generated combo-line semantics"
            git push origin HEAD:chatgpt-cycle67-3-combo-steps
          fi
