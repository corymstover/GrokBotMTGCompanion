name: M7 Deck 8 Cecily Bjorna Lutri ChatGPT Rev2 ten-swap review
on:
  pull_request:
    branches: [grokbot-deck08-cecily-bjorna-lutri-m7-20261023, chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m7-cecily-bjorna-chatgpt-rev2.yml
      - data/grixis/m7/candidate_lists/Cecily__Bjorna__Lutri_ChatGPT_M7_Rev2_Ten_Approval_Candidate.txt
      - data/grixis/m6/oracle_snapshots/Cecily__Bjorna__Lutri_ChatGPT_M7_Rev2_Selected_20261023.json
      - data/grixis/m7/decision_reviews/Cecily__Bjorna__Lutri_ChatGPT_M7_Rev2_Independent.md
      - tests/test_m7_cecily_bjorna_lutri_chatgpt_rev2.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bound-rev2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline validators
        run: python -m pip install --disable-pip-version-check jsonschema pytest
      - name: Record exact PR SHA
        run: git rev-parse HEAD
      - name: Ten-swap ChatGPT Rev2 exact source and companion legality checks
        run: python -m unittest discover -s tests -p test_m7_cecily_bjorna_lutri_chatgpt_rev2.py -v
      - name: Preserve original Grok six-swap candidate regressions
        run: python -m unittest discover -s tests -p test_m7_bjorna_nightfall_alchemist_cecily_candidate.py -v
