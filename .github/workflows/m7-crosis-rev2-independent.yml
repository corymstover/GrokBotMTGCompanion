name: M7 Deck 10 Crosis Rev2 independent audit
on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m7-crosis-rev2-independent.yml
      - data/grixis/m7/chatgpt_final_candidates/Crosis__the_Purger_M7_Rev2_Approval_Candidate_20261023.txt
      - data/grixis/m7/research_challengers/Crosis__the_Purger_M7_Rev2_Addon_Scryfall_20261023.json
      - data/grixis/m7/decision_packets/Crosis__the_Purger_M7_Rev2_ChatGPT_Independent_20261023.md
      - tests/test_m7_crosis_rev2_independent.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosis-rev2-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Log exact commit
        run: git rev-parse HEAD
      - name: Check independent Rev2 raw hash legality quantity and commander-specific rules
        run: python -m pytest -v tests/test_m7_crosis_rev2_independent.py
