name: M7 Deck 50 Sauron Dark Lord Rev1 Oracle cases and M7 decision gate

on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m7-sauron-dark-lord-rev1.yml
      - data/grixis/m7/sauron_dark_lord_rev1/**
      - data/grixis/m7/candidate_lists/Sauron__the_Dark_Lord_M7_Rev1.txt
      - data/grixis/m7/decision_reviews/Sauron__the_Dark_Lord_rev1.json
      - data/grixis/m6/ij/adjudications/Sauron_the_Dark_Lord_M7_Rev1_20261027.json
      - tests/test_m6_sauron_dark_lord_m7_rev1_cases.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sauron-dark-lord-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout pinned review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify approved raw bytes and candidate physical 100
        run: python data/grixis/m7/sauron_dark_lord_rev1/sauron_dark_lord_verify.py
      - name: Verify current all-card Scryfall identity and official Commander legality
        run: python data/grixis/m7/sauron_dark_lord_rev1/sauron_dark_lord_verify.py --live-scryfall
      - name: Execute all 15 blueprint P0 and P1 finite cases plus changed-card test
        run: python -m unittest discover -s tests -p 'test_m6_sauron_dark_lord_m7_rev1_cases.py' -v
      - name: Verify source-bound M7 full-99 final-decision schema and post-floor gate
        run: |
          python -m pip install jsonschema
          python scripts/grixis_m7_decision_gate.py --check
