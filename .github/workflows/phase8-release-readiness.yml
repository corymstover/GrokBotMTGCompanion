name: Phase 8 release readiness (read-only)

on:
  pull_request:
    paths:
      - 'scripts/release_readiness.py'
      - 'scripts/audit_foundation_graph_scope.py'
      - 'scripts/audit_lookup_rules_scope.py'
      - 'scripts/audit_release_bulk_delta.py'
      - 'scripts/certification_dry_run.py'
      - 'scripts/audit_full_checklist.py'
      - 'scripts/audit_release_snapshot_delta.py'
      - 'tests/test_full_checklist_triage.py'
      - 'tests/test_foundation_v290_checklist_closure.py'
      - 'tests/test_foundation_v291_dual_timeline.py'
      - 'tests/test_entity_coverage_audit.py'
      - 'scripts/audit_entity_coverage.py'
      - 'research/ENTITY_COVERAGE_AUDIT_2026-11-01.md'
      - 'data/lore_research/entity_coverage_audit_2026-11-01.json'
      - 'tests/test_release_snapshot_freshness.py'
      - 'research/FULL_CHECKLIST_TRIAGE_2026-10-31.md'
      - 'research/FULL_CHECKLIST_TRIAGE_2026-11-01.md'
      - 'research/RELEASE_TIME_SCRYFALL_2026-10-31.md'
      - 'data/scryfall_snapshots/**'
      - 'data/card_db/oracle_drift_2026-10-30.json'
      - 'scripts/build_foundation_acceptance_packet.py'
      - 'tests/test_foundation_acceptance_packet.py'
      - 'research/FOUNDATION_ACCEPTANCE_PACKET_2026-10-30.md'
      - 'tests/test_certification_dry_run.py'
      - 'research/CERTIFICATION_DRY_RUN_2026-10-30.md'
      - 'MTG_MULTIVERSE_MASTER_WORKFLOW.md'
      - 'tests/test_release_readiness.py'
      - 'tests/test_foundation_graph_scope.py'
      - 'tests/test_lookup_rules_scope.py'
      - 'data/release/**'
      - 'data/multiverse_graph/**'
      - 'data/card_db/**'
      - 'data/card_enrichment.json'
      - 'scripts/build_card_enrichment.py'
      - 'tests/test_phase8_batch38.py'
      - 'tests/test_enrichment_story_links_b4.py'
      - '.github/workflows/phase8-release-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Readiness report
        run: python3 scripts/release_readiness.py
      - name: Committed report statuses match a fresh evaluation
        run: |
          python3 - <<'PY'
          import json, glob, sys
          sys.path.insert(0, "scripts")
          import release_readiness as R
          live = {c["id"]: c["status"] for c in R.readiness()["criteria"]}
          f = sorted(glob.glob("data/release/readiness_*.json"))[-1]
          saved = {c["id"]: c["status"] for c in json.load(open(f))["criteria"]}
          assert live == saved, (f, live, saved)
          print("OK", f, saved)
          PY
      - name: Certification dry run matches (lists blockers; certifies nothing)
        run: python3 scripts/certification_dry_run.py --check
      - name: Every one of 137 project tasks is explicitly triaged
        run: |
          python3 scripts/audit_full_checklist.py --check
          python3 -m unittest discover -s tests -p 'test_full_checklist_triage.py' -v
      - name: Independently verify three newly closed engineering tasks
        run: python3 -m unittest tests.test_foundation_v290_checklist_closure -v
      - name: Source-safe dual-timeline closure (distinct real and fictional dates)
        run: python3 -m unittest tests.test_foundation_v291_dual_timeline -v
      - name: Registered world/entity source-grade coverage audit
        run: |
          python3 scripts/audit_entity_coverage.py --check
          python3 -m unittest tests.test_entity_coverage_audit -v
      - name: Latest source manifest and cross-bulk release-freshness proof
        run: |
          python3 scripts/audit_release_snapshot_delta.py --check
          python3 -m unittest discover -s tests -p 'test_release_snapshot_freshness.py' -v
      - name: Knowledge-only foundation acceptance evidence (not owner certification)
        run: |
          python3 scripts/build_foundation_acceptance_packet.py --check
          python3 -m unittest discover -s tests -p 'test_foundation_acceptance_packet.py' -v
      - name: Independently replay owner-bounded graph and dated supported lookup evidence
        run: |
          python3 scripts/audit_foundation_graph_scope.py --check
          python3 scripts/audit_lookup_rules_scope.py --check
          python3 -m unittest tests.test_foundation_graph_scope tests.test_lookup_rules_scope -v
      - name: Tests
        run: |
          python3 -m unittest discover -s tests -p 'test_release_readiness.py' -v
          python3 -m unittest discover -s tests -p 'test_certification_dry_run.py' -v
          python3 -m unittest discover -s tests -p 'test_phase8_batch38.py' -v
          python3 -m unittest discover -s tests -p 'test_enrichment_story_links_b4.py' -v
