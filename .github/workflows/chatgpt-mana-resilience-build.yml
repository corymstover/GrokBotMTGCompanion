name: Temporary ChatGPT mana resilience build

on:
  push:
    branches: [chatgpt-cycle68-5-mana-resilience]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCRYFALL_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle68-5-mana-resilience
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Run cache-independent Step C regression tests
        run: python -m pytest -q tests/test_mana_resilience.py
      - name: Build and check resilience records from committed frozen Step C artifacts
        run: |
          python scripts/grixis_mana_resilience.py --build
          python scripts/grixis_mana_resilience.py --check
      - name: Assert no development snapshot metadata changed
        run: git diff --exit-code HEAD -- data/grixis/dev_snapshot_lock.json
      - name: Commit generated records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grixis/mana_resilience
          if ! git diff --cached --quiet; then
            git commit -m "ChatGPT cycle 68.5: generate mana resilience evidence [skip ci]"
            git push
          fi
