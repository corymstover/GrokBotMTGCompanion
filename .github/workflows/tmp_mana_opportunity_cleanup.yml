name: tmp mana opportunity cleanup
on:
  push:
    branches:
      - chatgpt-cycle68-4-mana-opportunity
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCRYFALL_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle68-4-mana-opportunity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pytest
      - name: Tests
        run: pytest -q tests/test_mana_opportunity.py
      - name: Build
        run: |
          python scripts/grixis_mana_opportunity.py --build
          python scripts/grixis_mana_opportunity.py --check
      - name: Real output checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('data/grixis/mana_opportunity/abaddon-the-despoiler.json').read_text())
          names={x['card'] for x in a['utility_lands']}
          assert 'City of Brass' not in names, names
          s=json.loads(Path('data/grixis/mana_opportunity/summary.json').read_text())
          n=s['totals']['utility_lands']
          assert 0 < n < 500, n
          print('utility review population',n)
          PY
      - name: Commit and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/grixis_mana_opportunity.py data/grixis/mana_opportunity tests/test_mana_opportunity.py data/grixis/upgrade_plan.json
          git rm -f .github/workflows/tmp_mana_opportunity_fix.yml .github/workflows/tmp_mana_opportunity_cleanup.yml
          git commit -m "ChatGPT cycle 68.4: finalize utility and MDFC opportunity evidence [skip ci]"
          git push
