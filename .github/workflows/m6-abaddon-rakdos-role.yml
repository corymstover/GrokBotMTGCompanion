name: M6 Abaddon Rakdos role cost fixture
on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m6-abaddon-rakdos-role.yml
      - data/grixis/m6/phase_b_plans/abaddon_rakdos_role_20261021.json
      - scripts/grixis_m6_abaddon_rakdos_role.py
      - tests/test_m6_abaddon_rakdos_role.py
      - grixis/m6/abaddon_rakdos_opportunity_cost_20261021.md
      - data/grixis/graph/abaddon-the-despoiler.json
      - exports/grixis-archidekt/source-baseline/abaddon-the-despoiler.txt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rakdos-role-source-cost-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check approved source creature inventory and eleven bounded cost cases
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_rakdos_role.py' -v
      - name: Prevent fixture from claiming approvals or certifications
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('data/grixis/m6/phase_b_plans/abaddon_rakdos_role_20261021.json').read_text())
          tracker=json.loads(Path('data/grixis/milestone_m6_m7_subtracker.json').read_text())
          assert all(not value for value in plan['authority'].values())
          assert plan['canonical_authority']=='APPROVED_LOCKED_UNCHANGED'
          assert tracker['m6']['formal_m6_certified_decks']==0
          assert tracker['m7']['formal_m7_review_decisions']==0
          assert tracker['m6']['gates'][5]['status']=='PARTIAL'
          print('PASS: no authority changes, Phase B certification, or M7 approvals')
          PY
