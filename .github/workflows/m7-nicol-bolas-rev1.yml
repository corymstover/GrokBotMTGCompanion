name: M7 Deck 41 Nicol Bolas Rev1 exact-source checks

on:
  push:
    branches:
      - deck41-nicol-bolas-m7-rev1-proposal-20261026
  pull_request:
    paths:
      - 'data/grixis/m7/nicol_bolas_rev1/**'
      - 'data/grixis/m7/candidate_lists/Nicol_Bolas_chatgpt_rev1.txt'
      - '.github/workflows/m7-nicol-bolas-rev1.yml'
  workflow_dispatch:

jobs:
  nicol-bolas-integrity-rules-legality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact-SHA 100-card, singleton, delta and bounded interaction checks
        run: python -m unittest discover -v -s data/grixis/m7/nicol_bolas_rev1 -p 'test_nicol_bolas_m7_rev1.py'
      - name: Live Scryfall 99-name Commander legality and Oracle check
        run: python data/grixis/m7/nicol_bolas_rev1/verify_nicol_bolas_scryfall.py
