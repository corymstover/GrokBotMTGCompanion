name: ChatGPT cost-module sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'chatgpt-cycle66-7-costs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCRYFALL_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Wire card metadata and unsupported alternate-zone reasons
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/grixis_mechanics.py')
          s = p.read_text()
          old = '''def cards_index():\n    import grixis_candidates as gc\n    pool, _ = gc.load_pool()\n    return {n: {"text": gc.otext(c), "type_line": gc.tline(c)} for n, c in pool.items()}\n'''
          new = '''def cards_index():\n    import grixis_candidates as gc\n    pool, _ = gc.load_pool()\n\n    def row(c):\n        f = (c.get("card_faces") or [c])[0]\n        return {"text": gc.otext(c), "type_line": gc.tline(c),\n                "mana_cost": f.get("mana_cost") or c.get("mana_cost") or ""}\n\n    return {n: row(c) for n, c in pool.items()}\n'''
          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('cards_index signature changed; refusing blind edit')

          p = Path('scripts/grixis_mech/costs.py')
          s = p.read_text()
          old = '''    if RESOURCE_ALT.search(t) or re.search(r"rather than pay (?:~|this spell)'?s? mana cost|without paying its mana cost", t, re.I):\n        return None, "alternate cost depends on cards/life/resources or an unsupported condition"\n'''
          new = '''    if re.search(r"\\b(?:flashback|escape|retrace|jump-start|aftermath)\\b", t, re.I):\n        return None, "alternate zone/keyword casting cost is not modelled"\n    if RESOURCE_ALT.search(t) or re.search(r"rather than pay (?:~|this spell)'?s? mana cost|without paying its mana cost", t, re.I):\n        return None, "alternate cost depends on cards/life/resources or an unsupported condition"\n'''
          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('alternate_parse signature changed; refusing blind edit')
          PY
      - name: Regenerate mechanic registry
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / 'scripts'))
          import grixis_mech as gm
          from grixis_mech import router
          p = root / 'data/grixis/mechanics/modules.json'
          d = json.loads(p.read_text(encoding='utf-8'))
          d['framework_version'] = gm.FRAMEWORK_VERSION
          d['modules'] = gm.registry()
          d['planned_families'] = sorted(k for k in router.PLANNED if k not in gm.MODULES)
          p.write_text(json.dumps(d, indent=1, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - run: python -m pytest -q tests/test_mech_attack_semantics.py tests/test_mech_recursion_semantics.py tests/test_mech_stack_semantics.py tests/test_mech_cost_semantics.py
      - run: python scripts/grixis_mechanics.py --check
      - name: Commit generated/wiring changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/grixis_mechanics.py scripts/grixis_mech/costs.py data/grixis/mechanics/modules.json
            git commit -m "Wire cost metadata and regenerate mechanic registry"
            git push origin HEAD:${{ github.head_ref }}
          fi
