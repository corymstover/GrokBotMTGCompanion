name: "M7 Deck 61 Wick Rev1 exact-source certification"

on:
  pull_request:
    paths:
      - "data/grixis/m7/candidate_lists/Wick__the_Whorled_Mind_M7_Rev1*.txt"
      - "data/grixis/m7/wick_rev1/**"
      - "data/grixis/m7/decision_reviews/Wick__the_Whorled_Mind_rev1.json"
      - ".github/workflows/m7-deck61-wick-rev1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-oracle-rules-and-m7-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Exact Oct15 100 and all Rev1 portfolio hashes; 14 original case IDs plus scoped swap fixtures"
        run: python3 data/grixis/m7/wick_rev1/verify.py
      - name: "Install the project M7 JSON Schema validator"
        run: python3 -m pip install jsonschema
      - name: "Wick whole-99, 9 exact swaps, 12 judgments, two full larger packages"
        run: python3 scripts/grixis_m7_decision_gate.py --check --file data/grixis/m7/decision_reviews/Wick__the_Whorled_Mind_rev1.json
      - name: "Repository-wide M7 contract regression"
        run: python3 scripts/grixis_m7_decision_gate.py --check
