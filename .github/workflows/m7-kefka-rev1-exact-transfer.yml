name: Kefka M7 Rev1 exact candidate transfer

on:
  pull_request:
    paths:
      - 'data/grixis/m7/independent_candidates/Kefka__Court_Mage*'
      - 'data/grixis/m7/independent_reviews/Kefka__Court_Mage*'
      - 'data/grixis/m7/case_transfers/Kefka__Court_Mage*'
      - 'tests/test_m6_kefka_m7_rev1_exact_case_transfer.py'
      - 'tests/test_m7_kefka_rev1_oracle_and_exact_bytes.py'
      - 'tests/test_m7_kefka_chatgpt_independent_challengers.py'
      - '.github/workflows/m7-kefka-rev1-exact-transfer.yml'
  workflow_dispatch:

jobs:
  exact-candidate-case-transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact owner-presentable bytes and current all-100 Oracle archive
        run: python -m unittest discover -s tests -p test_m7_kefka_rev1_oracle_and_exact_bytes.py -v
      - name: Run mandatory scoped M6 P0 and P1 source-paid finite fixtures
        run: python -m unittest discover -s tests -p test_m6_kefka_m7_rev1_exact_case_transfer.py -v
      - name: Regression of 44 whole-100 candidate comparison assertions
        run: python -m unittest discover -s tests -p test_m7_kefka_chatgpt_independent_challengers.py -v
      - name: Retained M7 decision schema and exact-candidate source gate
        run: |
          python -m pip install jsonschema
          python scripts/grixis_m7_decision_gate.py --check --file data/grixis/m7/decision_reviews/Kefka__Court_Mage_rev1.json
