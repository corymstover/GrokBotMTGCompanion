name: ChatGPT cycle 94 - Abaddon effect-aware bounded follow-through
on:
  push:
    branches:
      - chatgpt-cycle94-abaddon-followthrough
    paths:
      - .github/workflows/chatgpt-cycle94-abaddon-followthrough.yml
      - scripts/grixis_m6_abaddon_followthrough.py
      - tests/test_m6_abaddon_followthrough.py
      - data/grixis/m6/phase_b_plans/abaddon_followthrough_01.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cycle94-abaddon-followthrough
  cancel-in-progress: true
jobs:
  conditional-followthrough:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle94-abaddon-followthrough
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run adversarial follow-through tests
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_followthrough.py' -v
      - name: Rebuild and validate SHA-bound conditional evidence
        run: python scripts/grixis_m6_abaddon_followthrough.py --build --check
      - name: Check approved authority and evidence-only scope
        run: |
          if git diff --name-only HEAD | grep -Ev '^data/grixis/m6/phase_b_bounded/' | grep -q .; then
            echo "Unauthorized generated data path"; exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path("data/grixis/registry.json").read_text())
          assert len(registry["decks"])==62
          assert registry["program"]["milestones"]["M5"]["status"]=="accepted"
          assert registry["program"]["milestones"]["M6"]["accepted_by"] is None
          plan=json.loads(Path("data/grixis/m6/phase_b_plans/abaddon_followthrough_01.json").read_text())
          result=json.loads(Path("data/grixis/m6/phase_b_bounded/abaddon_followthrough_01.json").read_text())
          assert plan["status"]=="registered_before_test"
          assert plan["approved_list_sha256"]==result["approved_list_sha256"]
          assert len(result["board_results"])==8
          assert len(result["printed_cascade_cases"])==24
          assert result["full_phase_b_complete"] is False
          assert result["effect_aware_deckwide_paired_test_executed"] is False
          assert result["supports_improvement_claim"] is False
          assert all(not v for v in result["authority"].values())
          PY
      - name: Commit only bounded evidence, not approved deck data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/grixis/m6/phase_b_bounded/abaddon_followthrough_01.json
          if git diff --cached --quiet; then
            echo 'already current'
          else
            git commit -m 'Cycle 94: record conditional Abaddon effect/colored-mana cases [skip ci]'
            git pull --rebase origin chatgpt-cycle94-abaddon-followthrough
            git push origin HEAD:chatgpt-cycle94-abaddon-followthrough
          fi
