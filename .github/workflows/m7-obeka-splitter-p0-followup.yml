name: M7 Deck 45 Obeka Splitter exact-100 Oracle and original five P0

on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - '.github/workflows/m7-obeka-splitter-p0-followup.yml'
      - 'data/grixis/m7/obeka_splitter_rev1/**'
      - 'data/grixis/m7/oracle_snapshots/Obeka__Splitter_of_Seconds_Rev1_Scryfall_20261028.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-100-source-bound-original-p0:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Candidate exact 100 structural and non-claiming engine scenarios
        run: python3 data/grixis/m7/obeka_splitter_rev1/verify_obeka_splitter_rev1.py
      - name: Source-bound five original required P0 C1 K1 K2 K3 F1
        run: python3 data/grixis/m7/obeka_splitter_rev1/m6_p0_followup.py
