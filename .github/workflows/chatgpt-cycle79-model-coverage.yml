name: ChatGPT cycle 79 - M6 model coverage hard gate
on:
  push:
    branches:
      - chatgpt-cycle79-m6-evidence-gates
    paths:
      - .github/workflows/chatgpt-cycle79-model-coverage.yml
      - scripts/grixis_m6_model_coverage.py
      - tests/test_m6_model_coverage.py
      - data/grixis/schemas/m6_model_coverage.schema.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cycle79-m6-model-coverage
  cancel-in-progress: true
jobs:
  model-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle79-m6-evidence-gates
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Negative tests
        run: python -m unittest discover -s tests -p 'test_m6_model_coverage.py' -v
      - name: Build and check all M5 proxy-coverage records
        run: python scripts/grixis_m6_model_coverage.py --build --check
      - name: Verify protected files unchanged
        run: |
          git diff --name-only HEAD | tee /tmp/c79-changed.txt
          if grep -Ev '^data/grixis/m6/model_coverage/' /tmp/c79-changed.txt | grep -q .; then
            echo 'Unexpected canonical or authority changes' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('data/grixis/registry.json').read_text())
          assert len(reg['decks'])==62
          assert reg['program']['milestones']['M5']['status']=='accepted'
          assert reg['program']['milestones']['M6']['accepted_by'] is None
          summary=json.loads(Path('data/grixis/m6/model_coverage/summary.json').read_text())
          assert summary['counts']['claim_eligible_from_M5']==0
          assert summary['counts']['decks']==62
          print('M5 proxy claims: zero; deck authority unchanged')
          PY
      - name: Commit evidence-only diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/grixis/m6/model_coverage/
          if git diff --cached --quiet; then
            echo 'Coverage records already current'
          else
            git commit -m 'Cycle 79: record M5 proxy coverage limits [skip ci]'
            git pull --rebase origin chatgpt-cycle79-m6-evidence-gates
            git push origin HEAD:chatgpt-cycle79-m6-evidence-gates
          fi
