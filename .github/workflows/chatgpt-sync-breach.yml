name: Temporary breach mechanics registry sync

on:
  push:
    branches: [chatgpt-cycle66-11-breach]

permissions:
  contents: write

jobs:
  sync-registry:
    if: ${{ !contains(github.event.head_commit.message, 'sync generated breach module registry') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCRYFALL_OFFLINE: "1"
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle66-11-breach
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate cache-independent module registry only
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / "scripts"))
          import grixis_mech as gm
          from grixis_mech import router
          out = ROOT / "data/grixis/mechanics/modules.json"
          data = {"framework_version": gm.FRAMEWORK_VERSION,
                  "modules": gm.registry(),
                  "planned_families": sorted(k for k in router.PLANNED if k not in gm.MODULES)}
          out.write_text(json.dumps(data, indent=1, ensure_ascii=False, sort_keys=True) + "\n")
          PY

      - name: Commit generated registry if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grixis/mechanics/modules.json
          if git diff --cached --quiet; then
            echo "Module registry already current."
          else
            git commit -m "ChatGPT: sync generated breach module registry"
            git push origin HEAD:chatgpt-cycle66-11-breach
          fi
