name: ChatGPT cycle 83 - Abaddon bounded mechanics
on:
  push:
    branches:
      - chatgpt-cycle83-abaddon-tests
    paths:
      - .github/workflows/chatgpt-cycle83-abaddon.yml
      - scripts/grixis_m6_abaddon_bounded.py
      - tests/test_m6_abaddon_bounded.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cycle83-abaddon-bounded
  cancel-in-progress: true
jobs:
  phase-b-bounded:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle83-abaddon-tests
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Negative and positive bounded-effect regression tests
        run: python -m unittest discover -s tests -p test_m6_abaddon_bounded.py -v
      - name: Generate and reproduce accepted-plan conditional evidence
        run: python scripts/grixis_m6_abaddon_bounded.py --build --check
      - name: No authority or deck changes
        run: |
          git diff --name-only | tee /tmp/changed
          if grep -Ev '^data/grixis/m6/phase_b_bounded/' /tmp/changed | grep -q .; then
            echo 'Unexpected canon/approval/registry path changed' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('data/grixis/registry.json').read_text())
          e=json.loads(Path('data/grixis/m6/phase_b_bounded/abaddon_01.json').read_text())
          assert len(reg['decks'])==62
          assert reg['program']['milestones']['M5']['status']=='accepted'
          assert reg['program']['milestones']['M6']['accepted_by'] is None
          assert e['stage']=='M6_partial_bounded_mechanics'
          assert e['phase_b_complete'] is False
          assert e['supports_improvement_claim'] is False
          assert not any(e['authority'].values())
          print('bounded data only; no decision/approved swap')
          PY
      - name: Commit isolated reproducible conditional evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/grixis/m6/phase_b_bounded/abaddon_01.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m 'Cycle 83: bounded Abaddon Phase B conditional evidence [skip ci]'
            git pull --rebase origin chatgpt-cycle83-abaddon-tests
            git push origin HEAD:chatgpt-cycle83-abaddon-tests
          fi
