name: Focused Grixis mechanics validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCRYFALL_OFFLINE: "1"
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Regenerate cache-independent mechanics registry
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / "scripts"))
          import grixis_mechanics as gm
          p = ROOT / "data/grixis/mechanics/modules.json"
          p.write_text(json.dumps(gm.registry_doc(), indent=1, ensure_ascii=False, sort_keys=True) + "\n")
          PY

      - name: Run mechanics semantic regression tests
        run: python -m pytest -q tests/test_mech_attack_semantics.py tests/test_mech_recursion_semantics.py tests/test_mech_stack_semantics.py tests/test_mech_cost_semantics.py tests/test_mech_tutor_semantics.py tests/test_mech_opponent_semantics.py tests/test_mech_stax_semantics.py tests/test_mech_breach_semantics.py tests/test_mech_pressure_semantics.py tests/test_mech_router_semantics.py

      - name: Check mechanic registry schema/coherence
        run: python scripts/grixis_mechanics.py --check

      - name: Sync generated registry to PR branch
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grixis/mechanics/modules.json
          if git diff --cached --quiet; then
            echo "Mechanics registry already current."
          else
            git commit -m "ChatGPT: sync Step E closure registry"
            git push origin HEAD:${{ github.head_ref }}
          fi
