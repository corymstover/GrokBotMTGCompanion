name: ChatGPT Birthday authority snapshot

on:
  push:
    branches: [chatgpt-cycle74-birthday-authority]
    paths:
      - .github/workflows/chatgpt-birthday-authority.yml
      - scripts/grixis_birthday_snapshot.py
  workflow_dispatch:

permissions:
  contents: write

env:
  SCRYFALL_BIRTHDAY_SNAPSHOT: "1"
  SCRYFALL_CACHE: .cache/birthday
  BIRTHDAY_CACHE: .cache/birthday
  FROZEN_CACHE: .cache/frozen

jobs:
  birthday-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle74-birthday-authority
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore and verify immutable snap-20261016 baseline
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          d=pathlib.Path('.cache/frozen'); d.mkdir(parents=True,exist_ok=True)
          lock=json.load(open('data/grixis/dev_snapshot_lock.json'))
          urls={
            'oracle-cards':'https://data.scryfall.io/oracle-cards/oracle-cards-20261016090200.jsonl.gz',
            'rulings':'https://data.scryfall.io/rulings/rulings-20261015090033.jsonl.gz',
            'default-cards':'https://data.scryfall.io/default-cards/default-cards-20261015090541.jsonl.gz',
          }
          for kind,name in lock['files'].items():
              p=d/name; urllib.request.urlretrieve(urls[kind],p)
              got='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
              if got != lock['sha256'][kind]: raise SystemExit(f'{kind} HASH MISMATCH {got}')
              print('frozen verified',kind,name,got)
          rlock=json.load(open('data/grixis/dev_rules_lock.json'))
          src=rlock['recovery_source']
          url=f"https://raw.githubusercontent.com/{src['repository']}/{src['commit']}/rules/MagicCompRules%2020260925.txt"
          p=d/rlock['file']; urllib.request.urlretrieve(url,p)
          b=p.read_bytes(); got='sha256:'+hashlib.sha256(b).hexdigest()
          blob=hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
          if got != rlock['sha256'] or len(b) != rlock['size'] or blob != src['git_blob_sha1']:
              raise SystemExit(f'frozen rules mismatch sha={got} size={len(b)} blob={blob}')
          print('frozen rules verified',p.name,got)
          PY

      - name: Normalize discovered Wizards rules URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/grixis_birthday_snapshot.py')
          s=p.read_text(encoding='utf-8')
          old='url = next((x for x in links if "MagicCompRules" in x), links[0])'
          new='url = urllib.parse.quote(next((x for x in links if "MagicCompRules" in x), links[0]), safe=":/?=&%")'
          if old in s:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
              print('patched rules URL normalization')
          elif new in s:
              print('rules URL normalization already present')
          else:
              raise SystemExit('expected rules URL assignment not found')
          PY

      - name: Collect current Birthday authority and evidence feeds
        id: collect
        shell: bash
        run: |
          set +e
          python scripts/grixis_birthday_snapshot.py --build
          rc=$?
          echo "build_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate fresh snapshot gate
        id: validate
        shell: bash
        run: |
          set +e
          python scripts/grixis_birthday_snapshot.py --check
          rc=$?
          echo "check_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit snapshot evidence and delta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/grixis_birthday_snapshot.py data/grixis/birthday_authority
          if git diff --cached --quiet; then
            echo "no snapshot changes to commit"
          else
            git commit -m "ChatGPT cycle 74: collect Birthday authority snapshot [skip ci]"
            git push origin HEAD:chatgpt-cycle74-birthday-authority
          fi

      - name: Enforce snapshot closure
        env:
          BUILD_RC: ${{ steps.collect.outputs.build_rc }}
          CHECK_RC: ${{ steps.validate.outputs.check_rc }}
        run: |
          echo "collector rc=$BUILD_RC validator rc=$CHECK_RC"
          test "$BUILD_RC" = "0"
          test "$CHECK_RC" = "0"

      - name: Snapshot summary
        if: always()
        run: |
          if test -f data/grixis/birthday_authority/manifest.json; then
            python - <<'PY'
          import json
          d=json.load(open('data/grixis/birthday_authority/manifest.json'))
          x=json.load(open('data/grixis/birthday_authority/delta_vs_snap-20261016.json'))
          print('snapshot',d['snapshot_id'],'status',d['status'])
          print('blockers',len(d['hard_blockers']))
          print('oracle',x['scryfall_oracle']['counts'])
          print('rulings added/removed',x['scryfall_rulings']['added'],x['scryfall_rulings']['removed'])
          print('rules changed',x['comprehensive_rules']['changed_vs_frozen'],x['comprehensive_rules']['fresh_effective_date'])
          print('EDHREC',d['sources']['edhrec']['counts'])
          print('Spellbook',d['sources']['commander_spellbook']['decks'],'decks',d['sources']['commander_spellbook']['near_miss_variants'],'near-misses')
          print('EDHTop16',d['sources']['edhtop16']['counts'])
          print('fresh deck legality',d['canonical_deck_legality']['counts'])
          PY
          fi
