name: Temporary ChatGPT deterministic human sampler

on:
  push:
    branches: [chatgpt-cycle71-2-human-sampler]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle71-2-human-sampler
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Freeze policy must still validate
        run: python scripts/grixis_human_sampling_policy.py --check
      - name: Focused sampler tests
        run: python -m pytest -q tests/test_human_sampling_policy.py tests/test_human_sampling.py
      - name: Build and replay deterministic manifest
        run: |
          python scripts/grixis_human_sampling.py --build
          python scripts/grixis_human_sampling.py --check
      - name: Update Step H plan and tracker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/grixis/upgrade_plan.json'); d=json.loads(p.read_text())
          s=next(x for x in d['steps'] if x['id']=='H'); s['status']='in_progress'; s['batches']=[
            '71.1 freeze pre-M6 human-sampling policy, seed, quotas, nine strata and future-result formulas with immutable hash record',
            '71.2 deterministic sampler + seven static strata selections + deduped review workload; future optimizer-disagreement/major-change functions regression-tested but remain empty before M6',
            '71.3 integration/freeze gate + review-execution manifest schema + gain proof (planned)'
          ]
          tr=d['launch_tracker']; tr['updated']='ChatGPT cycle 71.2 (2026-10-16)'
          x=next(x for x in tr['stages'] if x['id']=='H'); x['batches_done']=2; x['status']='in_progress'; x['note']='2/2.5 batch-equivalents complete: frozen policy now has a deterministic replayable sampler, static selections and deduped workload; dynamic strata formulas are tested but intentionally unpopulated pre-M6.'
          tr['batches_done']=41; tr['percent_complete']=65.6
          p.write_text(json.dumps(d,indent=1,ensure_ascii=False)+'\n')
          md=Path('grixis/Grixis Birthday Upgrade Plan.md'); t=md.read_text(); marker='### Step H batch 71.2: deterministic sampler and static selections'
          if marker not in t:
              t += '''\n\n### Step H batch 71.2: deterministic sampler and static selections\n\n- `scripts/grixis_human_sampling.py` deterministically replays the frozen v1 policy. Static strata are selected now from committed pre-M6 evidence and written to `human_sampling_manifest.json`; overlap memberships are preserved while the total static workload is deduplicated.\n- Exception and pending-release strata select all eligible decks. Random/anomaly/cEDH/low-commander-dependence/rules-sensitive strata use the frozen quotas and ranking formulas with the frozen SHA-256 tie-break seed.\n- `high_optimizer_disagreement` and `major_change` remain empty with `awaiting_future_inputs`; their ranking functions are implemented and synthetic-order-independence tested now so M6 results cannot change the formula later.\n- Optimizer-disagreement inputs require committed Pass A/B hashes. Major-change eligibility/ranking follows the exact frozen triggers.\n- The generated manifest records the policy hash and selection inputs for every selected deck. No sampling record can decide a deck change.\n'''
              md.write_text(t)
          PY
      - name: Recheck sampler after plan updates
        run: |
          python scripts/grixis_human_sampling_policy.py --check
          python scripts/grixis_human_sampling.py --check
      - name: Assert snapshot metadata unchanged
        run: git diff --exit-code HEAD -- data/grixis/dev_snapshot_lock.json
      - name: Commit manifest and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-human-sampler.yml
          git add data/grixis/human_sampling_manifest.json data/grixis/upgrade_plan.json 'grixis/Grixis Birthday Upgrade Plan.md'
          git commit -m "ChatGPT cycle 71.2: finalize deterministic human sampler [skip ci]"
          git push
