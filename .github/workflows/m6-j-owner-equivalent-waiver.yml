name: M6 J owner-equivalent reviewer provenance guard
on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m6-j-owner-equivalent-waiver.yml
      - data/grixis/schemas/m6_reproducibility_bundle.schema.json
      - scripts/grixis_m6_bundle_check.py
      - tests/test_m6_j_owner_equivalent_receipt.py
      - tests/test_m6_bundle_check.py
      - grixis/Grixis M6 I-J Contract.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-waiver-j-reviewer-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install JSON schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate owner-equivalent provenance and legacy final-bundle guards
        run: python -m unittest discover -s tests -p 'test_m6_j_owner_equivalent_receipt.py' -v && python -m unittest discover -s tests -p 'test_m6_bundle_check.py' -v
      - name: Confirm validated J evidence does not manufacture owner milestone acceptance
        run: |
          python scripts/grixis_m6_bundle_check.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path('data/grixis/milestone_m6_m7_subtracker.json').read_text())
          assert t['m6']['formal_m6_certified_decks']==0
          assert t['m7']['formal_m7_review_decisions']==0
          assert t['m6']['gates'][4]['status']=='COMPLETE'
          assert t['m6']['gates'][8]['status']=='BLOCKED'
          print('PASS: owner-waived review and existing J source bundles validate; aggregate M6 and M7 owner acceptance is not inferred.')
          PY
