name: Phase 6 lore pilots (spec-driven, unapproved)

on:
  pull_request:
    paths:
      - 'data/lore_decks/specs/**'
      - 'data/lore_decks/drafts/**'
      - 'scripts/build_lore_pilot.py'
      - 'scripts/audit_lore_pilot.py'
      - 'scripts/audit_phase6_engine_scope.py'
      - 'scripts/lore_deck_candidates.py'
      - 'scripts/lore_deck_restrictions.py'
      - 'scripts/audit_lore_commander_comparison.py'
      - 'tests/test_lore_pilot_builder.py'
      - 'tests/test_pilot3_ugins_allies.py'
      - 'tests/test_phase6_engine_scope.py'
      - 'tests/test_lore_deck_restrictions.py'
      - 'tests/test_lore_commander_comparison.py'
      - 'data/lore_decks/commander_comparison_spec_2026-11-01.json'
      - 'data/release/phase6_commander_comparison_2026-11-01.json'
      - 'data/release/phase6_engine_scope_review_2026-11-01.json'
      - 'data/story_atlas/**'
      - 'data/lore_research/**'
      - '.github/workflows/phase6-lore-pilots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lore-pilots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit every pilot spec against its committed proposal
        run: python3 scripts/audit_lore_pilot.py
      - name: Builder and audit tests
        run: python3 -m unittest discover -s tests -p 'test_lore_pilot_builder.py' -v
      - name: Pilot 3 (Ugin's Allies and Heroes) checks
        run: python3 -m unittest discover -s tests -p 'test_pilot3_ugins_allies.py' -v
      - name: Certified foundation prerequisite and four bounded Phase 6 engine gates
        run: python3 scripts/audit_phase6_engine_scope.py --check
      - name: Curated grade retrieval and exact import integrity
        run: python3 -m unittest discover -s tests -p 'test_phase6_engine_scope.py' -v
      - name: Chosen set, first-printed-in and publication-era restrictions
        run: python3 -m unittest discover -s tests -p 'test_lore_deck_restrictions.py' -v
      - name: Date-qualified alternative commander identity and graded story context
        run: |
          python3 scripts/audit_lore_commander_comparison.py --check
          python3 -m unittest discover -s tests -p 'test_lore_commander_comparison.py' -v
