name: ChatGPT cycle 100 - all-62 conserved state kernel
on:
  push:
    branches:
      - chatgpt-cycle100-general-state-kernel
    paths:
      - .github/workflows/chatgpt-cycle100-general-state-kernel.yml
      - data/grixis/m6/phase_b_plans/general_state_kernel_62_01.json
      - scripts/grixis_m6_state_kernel.py
      - scripts/grixis_m6_state_kernel_62.py
      - tests/test_m6_state_kernel.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cycle100-general-state-kernel
  cancel-in-progress: true
jobs:
  cross-deck-conservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle100-general-state-kernel
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Adversarial physical-card ledger tests
        run: python -m unittest discover -s tests -p 'test_m6_state_kernel.py' -v
      - name: Restore SHA-256 locked October 2026 Scryfall bundle
        run: |
          python - <<'PY'
          import hashlib,pathlib,urllib.request
          cache=pathlib.Path('.cache');cache.mkdir(exist_ok=True)
          for kind,name,expected in [
            ('oracle-cards','oracle-cards-20261016090200.jsonl.gz','ea7abac9906633415553b585b32c4071c79d42ba23d7e3163a0c4e9c265a7483'),
            ('rulings','rulings-20261015090033.jsonl.gz','3d2dfbd501d1f1b35146e9c57b91121cb6f01f8aa5f88b19c3f28ad31492c85a'),
            ('default-cards','default-cards-20261015090541.jsonl.gz','f902a9a655c9854f535a8f02b1374540c564e31ef405ec8325acb2adbb6672f8')
          ]:
            dest=cache/name
            urllib.request.urlretrieve('https://data.scryfall.io/'+kind+'/'+name,dest)
            if hashlib.sha256(dest.read_bytes()).hexdigest()!=expected:
              raise SystemExit('Pinned Scryfall checksum drift: '+name)
            print('verified locked source',name)
          PY
          python scripts/check_dev_snapshot_lock.py
      - name: Replay deterministic 62 commander source baselines and conserved draws
        run: python -u scripts/grixis_m6_state_kernel_62.py --build
      - name: Independently replay every roster entry and compare entire receipts
        run: python -u scripts/grixis_m6_state_kernel_62.py --check
      - name: Require 62 decks 248 deterministic samples with zero promotions
        run: |
          if git diff --name-only HEAD | grep -Ev '^data/grixis/m6/phase_b_bounded/' | grep -q .; then
            echo 'Forbidden write outside experimental M6';exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/grixis/m6/phase_b_bounded/general_state_kernel_62_01.json').read_text())
          r=json.loads(Path('data/grixis/registry.json').read_text())
          assert len(r['decks'])==62
          assert r['program']['milestones']['M5']['status']=='accepted'
          assert r['program']['milestones']['M6']['accepted_by'] is None
          assert d['roster_decks']==62 and d['total_samples']==248
          assert d['all_samples_physical_conservation_verified'] is True
          assert d['card_abilities_executed'] is False
          assert d['full_gameplay_simulator'] is False
          assert d['commander_first_decisions_certified']==0
          assert d['full_phase_b_complete'] is False
          assert d['supports_improvement_claim'] is False
          assert not any(d['authority'].values())
          for deck in d['deck_samples']:
            assert deck['physical_card_count']==100
            assert len(deck['samples'])==4
            for trial in deck['samples']:
              assert len(trial['opening_names'])==7
              assert len(trial['subsequent_draw_names'])==4
              assert trial['conservation_pass'] is True
              z=trial['post_draw_zone_counts']
              assert sum(z.values())==100 and z['hand']==11
              assert z['command']==len(deck['commanders'])
          print('62 baseline inventories, 248 exact card-conservation samples, zero game/approval claims')
          PY
      - name: Commit bounded derived evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/grixis/m6/phase_b_bounded/general_state_kernel_62_01.json
          if git diff --cached --quiet; then
            echo 'Cycle 100 evidence already current'
          else
            git commit -m 'Cycle 100: record all-62 conserved state kernel receipts [skip ci]'
            git pull --rebase origin chatgpt-cycle100-general-state-kernel
            git push origin HEAD:chatgpt-cycle100-general-state-kernel
          fi
