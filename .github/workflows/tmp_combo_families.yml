name: tmp combo families
on:
  push:
    branches: [chatgpt-cycle67-4-combo-families]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema pytest
      - name: Semantic unit tests
        run: pytest -q tests/test_combo_families.py
      - name: Build and validate
        run: |
          python3 scripts/grixis_combo_families.py --build
          python3 scripts/grixis_combo_families.py --check
      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grixis/combo_families
          if ! git diff --cached --quiet; then
            git commit -m "ChatGPT: generate combo variant-family evidence [skip ci]"
            git push
          fi
