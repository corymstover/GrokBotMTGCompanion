name: M7 Ashad Rev3 strict M6 I/J exact-source evidence (NOT APPROVAL)
on:
  pull_request:
    paths:
      - "data/grixis/m6/ij/certificates/ashad-the-lone-cyberman-m7-rev3.json"
      - "data/grixis/m6/ij/revision_bundles/ashad-the-lone-cyberman-m7-rev3.json"
      - "data/grixis/m6/certification_preflight/Ashad__the_Lone_Cyberman_M6_*Rev3*"
      - "tests/test_m6_ashad_rev3_ij.py"
      - ".github/workflows/m7-ashad-chatgpt-rev3-ij.yml"
  push:
    branches: ["grokbot-deck05-ashad-the-lone-cyberman-m7-20261023"]
    paths:
      - "data/grixis/m6/ij/certificates/ashad-the-lone-cyberman-m7-rev3.json"
      - "data/grixis/m6/ij/revision_bundles/ashad-the-lone-cyberman-m7-rev3.json"
      - "tests/test_m6_ashad_rev3_ij.py"
permissions:
  contents: read
jobs:
  rev3-ij-local-evidence-not-owner-approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact-source schema verifier
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Check Rev3 independent I/J contract, original sealed evidence, and fail-closed SHA
        run: python -m unittest discover -s tests -p 'test_m6_ashad_rev3_ij.py' -v
      - name: Check preferred full-100 Oracle and logical hash independent of owner authority
        run: python -m unittest discover -s tests -p 'test_m7_ashad_chatgpt_rev3_owner_candidate.py' -v
