name: Temporary Step B checker fix

on:
  push:
    branches: [chatgpt-cycle67-4-step-b-closure]

permissions:
  contents: write

jobs:
  fix-checker:
    if: ${{ !contains(github.event.head_commit.message, 'exclude gain artifact from combo deck coverage') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle67-4-step-b-closure
          fetch-depth: 0
      - name: Exclude non-deck gain artifact from combo-quality deck-file coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/grixis_combo_quality.py')
          s = p.read_text()
          old = 'present = {p.stem for p in OUT.glob("*.json") if p.name != "summary.json"}'
          new = 'present = {p.stem for p in OUT.glob("*.json") if p.name not in ("summary.json", "decision_quality_gain.json")}'
          if old not in s:
              if new in s:
                  raise SystemExit(0)
              raise SystemExit('combo-quality coverage expression not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit checker fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/grixis_combo_quality.py
          if git diff --cached --quiet; then
            echo "checker already fixed"
          else
            git commit -m "ChatGPT: exclude gain artifact from combo deck coverage"
            git push origin HEAD:chatgpt-cycle67-4-step-b-closure
          fi
