name: M7 Deck36 Mishra Artificer Rev1 exact certification
on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m7-mishra-artificer-rev1.yml
      - data/grixis/m7/candidate_lists/Mishra__Artificer_Prodigy_chatgpt_rev1.txt
      - data/grixis/m7/decision_reviews/Mishra__Artificer_Prodigy_rev1.json
      - data/grixis/m7/decision_reviews/Mishra__Artificer_Prodigy_chatgpt_rev1_review.md
      - data/grixis/m7/oracle_snapshots/Mishra__Artificer_Prodigy_Rev1_Scryfall_20261026.json
      - data/grixis/m7/research_challengers/Mishra__Artificer_Prodigy_rev1_*.txt
      - data/grixis/m7/verification/Mishra__Artificer_Prodigy_M7_Rev1_Case_Transfer_20261026.json
      - tests/test_m7_mishra_artificer_rev1.py
permissions:
  contents: read
jobs:
  deck36-exact-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install structural dependency
        run: python -m pip install jsonschema
      - name: Verify exact 100 Scryfall and P0-P1 finite cases
        run: python -m unittest discover -s tests -p 'test_m7_mishra_artificer_rev1.py' -v
      - name: Validate open-ended M7 whole-99 source-bound decision gate
        run: python scripts/grixis_m7_decision_gate.py --check --file data/grixis/m7/decision_reviews/Mishra__Artificer_Prodigy_rev1.json
