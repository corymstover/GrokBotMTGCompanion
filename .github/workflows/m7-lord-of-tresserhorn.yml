name: M7 Deck 29 Lord of Tresserhorn review candidate (focused)
on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m7-lord-of-tresserhorn.yml
      - data/grixis/registry.json
      - data/grixis/schemas/**
      - data/grixis/m7/**
      - data/grixis/m6/**
      - scripts/grixis_authority.py
      - scripts/grixis_m6_bundle_check.py
      - scripts/grixis_m7_decision_gate.py
      - tests/test_m7_lord_of_tresserhorn_candidate.py
      - tests/test_m6_lord_of_tresserhorn_m7_mechanics.py
      - tests/test_m6_lord_of_tresserhorn_m7_approved_case_transfer.py
      - tests/test_m6_lord_of_tresserhorn_m7_ij.py
      - tests/test_m6_pass_c_corpus_stabilization.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lord-of-tresserhorn-m7:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline validators
        run: python -m pip install --disable-pip-version-check jsonschema pytest
      - name: Record exact head
        run: git rev-parse HEAD
      - name: Deck 29 M7 gate review candidate (five swaps, flagged owner cuts, commander first, hashes, staged alternatives, no approval)
        run: python -m pytest -v tests/test_m7_lord_of_tresserhorn_candidate.py
      - name: Deck 29 Oracle-anchored rules (actual enters trigger and own regeneration), Dress Down layer-6 truth table, bounded Pass C grids, goldfish cells and combo delta
        run: python -m pytest -v tests/test_m6_lord_of_tresserhorn_m7_mechanics.py
      - name: Owner-approved exact 100 M6 P0/P1 finite case transfer (five P0 and nine P1)
        run: python -m pytest -v tests/test_m6_lord_of_tresserhorn_m7_approved_case_transfer.py
      - name: Deck 29 candidate-specific I/J hash binding, J checker and Pass C wording
        run: python -m pytest -v tests/test_m6_lord_of_tresserhorn_m7_ij.py
      - name: Shared Pass C corpus stabilization (fail-closed, 60 of 62 pass, decks 30 and 31 rejected)
        run: python -m pytest -v tests/test_m6_pass_c_corpus_stabilization.py
      - name: All M7 packets structural gate with sources
        run: python scripts/grixis_m7_decision_gate.py --check --check-sources
      - name: M6 J standard bundle checker (stabilized Pass C corpus checker)
        run: python scripts/grixis_m6_bundle_check.py --check
