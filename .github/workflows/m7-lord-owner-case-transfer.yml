name: M7 Deck 29 Lord owner-approved exact M6 case transfer
on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m7-lord-owner-case-transfer.yml
      - tests/test_m6_lord_of_tresserhorn_m7_approved_case_transfer.py
      - data/grixis/m6/test_blueprints/Lord_of_Tresserhorn.json
      - data/grixis/m6/oracle_snapshots/Lord_of_Tresserhorn_M7_Scryfall_20261023.json
      - data/grixis/m7/candidate_lists/Lord_of_Tresserhorn.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-100-source-bound-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test framework
        run: python -m pip install --disable-pip-version-check pytest
      - name: Record tested commit
        run: git rev-parse HEAD
      - name: 5 P0 and 9 P1 bounded exact-100 Lord cases
        run: python -m pytest -v tests/test_m6_lord_of_tresserhorn_m7_approved_case_transfer.py
