name: Phase 1B explicit Eternal set codes and Clash Pack sources
on:
  push:
    branches: [main, chatgpt-phase1b-inserts-clash-spellbook-20261029]
    paths:
      - scripts/audit_inserts_clash_spellbook_sources.py
      - scripts/product_family_lookup.py
      - tests/test_inserts_clash_spellbook_sources.py
      - data/set_atlas/inserts_clash_spellbook_*
      - .github/workflows/phase1b-inserts-clash-spellbook.yml
  pull_request:
    paths:
      - scripts/audit_inserts_clash_spellbook_sources.py
      - scripts/product_family_lookup.py
      - tests/test_inserts_clash_spellbook_sources.py
      - data/set_atlas/inserts_clash_spellbook_*
      - .github/workflows/phase1b-inserts-clash-spellbook.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inserts-clash-spellbook-source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce nine-source graded code and product family audits
        run: python3 -m unittest discover -s tests -p test_inserts_clash_spellbook_sources.py -v
      - name: Reproduce source report and check frozen lookup
        run: |
          python3 scripts/audit_inserts_clash_spellbook_sources.py
          python3 scripts/product_family_lookup.py --summary
          python3 -m py_compile scripts/audit_inserts_clash_spellbook_sources.py scripts/product_family_lookup.py
