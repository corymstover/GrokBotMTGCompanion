name: M7 Deck37 Mishra Eminent One Rev1 exact certification
on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m7-mishra-eminent-rev1.yml
      - data/grixis/m7/candidate_lists/Mishra__Eminent_One_chatgpt_rev1.txt
      - data/grixis/m7/decision_reviews/Mishra__Eminent_One_rev1.json
      - data/grixis/m7/decision_reviews/Mishra__Eminent_One_chatgpt_rev1_review.md
      - data/grixis/m7/oracle_snapshots/Mishra__Eminent_One_Rev1_Scryfall_20261026.json
      - tests/test_m7_mishra_eminent_rev1.py
permissions:
  contents: read
jobs:
  deck37-exact-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install structural dependency
        run: python -m pip install jsonschema
      - name: Verify 100 live source-bound Oracle identities and finite rules cases
        run: python -m unittest discover -s tests -p 'test_m7_mishra_eminent_rev1.py' -v
      - name: Validate M7 whole-99 open-ended source-bound decision gate
        run: python scripts/grixis_m7_decision_gate.py --check --file data/grixis/m7/decision_reviews/Mishra__Eminent_One_rev1.json
