name: Phase 3 Multiverse cited claim graph

on:
  pull_request:
    paths:
      - 'data/multiverse_graph/**'
      - 'data/lore_research/**'
      - 'data/lore_decks/drafts/*_printing_evidence.json'
      - 'data/lore_graph.json'
      - 'scripts/build_multiverse_graph.py'
      - 'scripts/query_multiverse_graph.py'
      - 'tests/test_multiverse_graph.py'
      - 'scripts/build_card_name_anchors.py'
      - 'tests/test_card_name_anchors.py'
      - 'scripts/audit_lore_pack_rtd.py'
      - 'tests/test_lore_pack_rtd.py'
      - 'scripts/audit_lore_pack_a5.py'
      - 'tests/test_lore_pack_a5.py'
      - 'scripts/audit_lore_pack_c3.py'
      - 'tests/test_lore_pack_c3.py'
      - 'scripts/audit_lore_pack_c4.py'
      - 'tests/test_lore_pack_c4.py'
      - 'scripts/build_claim_card_anchors.py'
      - 'tests/test_claim_card_anchors.py'
      - 'scripts/build_koth_wrenn_printing_leads.py'
      - 'tests/test_koth_wrenn_printing_leads.py'
      - 'data/lore_research/koth_wrenn_printing_leads_2026-10-30.json'
      - 'scripts/build_story_coverage_inventory.py'
      - 'tests/test_story_coverage_inventory.py'
      - 'scripts/story_claim_pipeline.py'
      - 'tests/test_story_claim_pipeline.py'
      - 'data/primary_sources.csv'
      - 'data/story_atlas/**'
      - 'scripts/build_story_art_captions.py'
      - 'tests/test_story_art_captions.py'
      - '.github/workflows/phase3-multiverse-claim-graph.yml'
  push:
    paths:
      - 'data/multiverse_graph/**'
      - 'data/lore_research/**'
      - 'scripts/build_multiverse_graph.py'
      - 'scripts/query_multiverse_graph.py'
      - 'tests/test_multiverse_graph.py'
      - 'scripts/build_card_name_anchors.py'
      - 'tests/test_card_name_anchors.py'
      - 'scripts/audit_lore_pack_rtd.py'
      - 'tests/test_lore_pack_rtd.py'
      - 'scripts/audit_lore_pack_a5.py'
      - 'tests/test_lore_pack_a5.py'
      - 'scripts/audit_lore_pack_c3.py'
      - 'tests/test_lore_pack_c3.py'
      - 'scripts/audit_lore_pack_c4.py'
      - 'tests/test_lore_pack_c4.py'
      - 'scripts/build_claim_card_anchors.py'
      - 'tests/test_claim_card_anchors.py'
      - 'scripts/build_koth_wrenn_printing_leads.py'
      - 'tests/test_koth_wrenn_printing_leads.py'
      - 'data/lore_research/koth_wrenn_printing_leads_2026-10-30.json'
      - 'scripts/build_story_coverage_inventory.py'
      - 'tests/test_story_coverage_inventory.py'
      - 'scripts/story_claim_pipeline.py'
      - 'tests/test_story_claim_pipeline.py'
      - 'data/primary_sources.csv'
      - 'data/story_atlas/**'
      - 'scripts/build_story_art_captions.py'
      - 'tests/test_story_art_captions.py'
      - '.github/workflows/phase3-multiverse-claim-graph.yml'
  workflow_dispatch:

jobs:
  claim-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild graph and fail if committed copy is stale or invalid
        run: python3 scripts/build_multiverse_graph.py --check
      - name: Sample bidirectional queries
        run: |
          python3 scripts/query_multiverse_graph.py path piru ugin
          python3 scripts/query_multiverse_graph.py status CANON_DISPUTED
          python3 scripts/query_multiverse_graph.py card "Crux of Fate" > /dev/null
      - name: Graph regression and mutation tests
        run: python3 -m unittest discover -s tests -p 'test_multiverse_graph.py' -v
      - name: Card name anchors (self-hash; snapshot absent in CI) and tests
        run: |
          python3 scripts/build_card_name_anchors.py --check
          python3 -m unittest discover -s tests -p 'test_card_name_anchors.py' -v
      - name: Pack C2 Return to Dominaria quote audit (hashes; cache absent in CI) and tests
        run: |
          python3 scripts/audit_lore_pack_rtd.py --check
          python3 -m unittest discover -s tests -p 'test_lore_pack_rtd.py' -v
      - name: Pack A5 Ugin's allies quote audit (Pilot 3 research; hashes, cache absent in CI) and tests
        run: |
          python3 scripts/audit_lore_pack_a5.py --check
          python3 -m unittest discover -s tests -p 'test_lore_pack_a5.py' -v
      - name: Pack C3 Assault on New Phyrexia quote audit (hashes; cache absent in CI) and tests
        run: |
          python3 scripts/audit_lore_pack_c3.py --check
          python3 -m unittest discover -s tests -p 'test_lore_pack_c3.py' -v
      - name: Pack C4 March of the Machine quote audit (hashes; cache absent in CI) and tests
        run: |
          python3 scripts/audit_lore_pack_c4.py --check
          python3 -m unittest discover -s tests -p 'test_lore_pack_c4.py' -v
      - name: Claim-level card anchors (self-hash and structure; snapshot absent in CI) and tests
        run: |
          python3 scripts/build_claim_card_anchors.py --check
          python3 -m unittest discover -s tests -p 'test_claim_card_anchors.py' -v
      - name: Koth/Wrenn printing-level lead review (self-hash and structure; caches absent in CI) and tests
        run: |
          python3 scripts/build_koth_wrenn_printing_leads.py --check
          python3 -m unittest discover -s tests -p 'test_koth_wrenn_printing_leads.py' -v
      - name: Phase 5 bulk story claim packs (spec rebuild, quote hashes; cache absent in CI) and tests
        run: |
          python3 scripts/story_claim_pipeline.py check
          python3 -m unittest discover -s tests -p 'test_story_claim_pipeline.py' -v
      - name: Story coverage/gaps inventory (rebuild and compare) and tests
        run: |
          python3 scripts/build_story_coverage_inventory.py --check
          python3 -m unittest discover -s tests -p 'test_story_coverage_inventory.py' -v
      - name: Story-art caption atlas (self-hash; caches absent in CI) and tests
        run: |
          python3 scripts/build_story_art_captions.py --check
          python3 -m unittest discover -s tests -p 'test_story_art_captions.py' -v
