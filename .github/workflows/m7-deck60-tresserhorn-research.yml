name: "M7 Deck 60 Tresserhorn exact-head research"

on:
  pull_request:
    paths:
      - "data/grixis/m7/candidate_lists/Tresserhorn_s_Lord__Returned_M7_Rev1*.txt"
      - "data/grixis/m7/decision_reviews/Tresserhorn_s_Lord__Returned_M7_Rev1_RESEARCH.md"
      - "data/grixis/m7/tresserhorn_returned_rev1/**"
      - ".github/workflows/m7-deck60-tresserhorn-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-research-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin approved source, full-100 research candidate, Alt5 and Alt9
        run: python3 data/grixis/m7/tresserhorn_returned_rev1/verify.py
      - name: Execute five exact-source M6 P0 finite cases
        run: python3 data/grixis/m7/tresserhorn_returned_rev1/m6_p0_followup.py
      - name: Execute ten changed-context M6 P1 finite cases
        run: python3 data/grixis/m7/tresserhorn_returned_rev1/m6_p1_followup.py
      - name: Compare Rev1 and Alt5 in four finite named starting states
        run: python3 data/grixis/m7/tresserhorn_returned_rev1/same_start_compare.py
      # This is a research-check workflow, not an M7 owner-ready certificate.
      # Fresh complete Oracle, I/J scope mapping, M7 decision gate and owner
      # approval are separate mandatory steps and are NOT asserted here.
