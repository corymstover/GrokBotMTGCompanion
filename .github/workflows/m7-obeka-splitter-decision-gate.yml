name: M7 Deck 45 Obeka Splitter decisive exact-100 decision gate

on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - '.github/workflows/m7-obeka-splitter-decision-gate.yml'
      - 'data/grixis/m7/decision_reviews/Obeka__Splitter_of_Seconds_rev1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-scope-and-actual-decision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check jsonschema
      - name: Prospective full-deck M7 decision packet — six actual source-bound changes
        run: python3 scripts/grixis_m7_decision_gate.py --check --file data/grixis/m7/decision_reviews/Obeka__Splitter_of_Seconds_rev1.json
      - name: Original five P0 bounded tests and current source legality
        run: python3 data/grixis/m7/obeka_splitter_rev1/m6_p0_followup.py
