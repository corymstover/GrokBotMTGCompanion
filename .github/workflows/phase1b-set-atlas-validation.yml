name: Phase 1B set and printing atlas validation

on:
  pull_request:
    paths:
      - scripts/audit_set_printing_atlas.py
      - scripts/set_atlas_lookup.py
      - tests/test_set_printing_atlas.py
      - data/set_atlas/**
      - .github/workflows/phase1b-set-atlas-validation.yml
  push:
    branches: [main]
    paths:
      - scripts/audit_set_printing_atlas.py
      - scripts/set_atlas_lookup.py
      - tests/test_set_printing_atlas.py
      - data/set_atlas/**
      - .github/workflows/phase1b-set-atlas-validation.yml

permissions:
  contents: read

jobs:
  dated-atlas-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify snapshot guards, counting rules and published catalog totals
        run: python3 -m unittest discover -s tests -p 'test_set_printing_atlas.py' -v
      - name: Check Python syntax
        run: python3 -m py_compile scripts/audit_set_printing_atlas.py scripts/set_atlas_lookup.py
