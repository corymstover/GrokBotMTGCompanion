name: ChatGPT stax-module sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'chatgpt-cycle66-10-stax'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCRYFALL_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Add exact symmetric spell-tax grammar
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/grixis_mech/stax.py')
          s = p.read_text()
          needle = '''COST_MORE = re.compile(\n    r"(?P<scope>noncreature )?spells (?P<who>your opponents|opponents|players)? ?cast cost (?P<cost>(?:\\{[^}]+\\})+) more to cast",\n    re.I,\n)\n'''
          repl = needle + '''SYMMETRIC_COST_MORE = re.compile(\n    r"(?P<scope>noncreature )?spells cost (?P<cost>(?:\\{[^}]+\\})+) more to cast", re.I\n)\n'''
          if 'SYMMETRIC_COST_MORE' not in s:
              if needle not in s:
                  raise SystemExit('tax regex signature changed; refusing blind edit')
              s = s.replace(needle, repl)
          marker = '''    for sent in semantics.sentences(t):\n        m = COST_MORE.search(sent)\n'''
          insert = '''    for sent in semantics.sentences(t):\n        m = SYMMETRIC_COST_MORE.search(sent)\n        if m:\n            mana = _mana(m.group("cost"))\n            if mana is None:\n                reasons.append("variable spell tax is not modelled")\n            else:\n                rules.append({"kind": "spell_tax", "scope": "noncreature" if m.group("scope") else "any",\n                              "amount": mana, "self_burden": True})\n            continue\n        m = COST_MORE.search(sent)\n'''
          if insert not in s:
              if marker not in s:
                  raise SystemExit('parse loop signature changed; refusing blind edit')
              s = s.replace(marker, insert)
          p.write_text(s)
          PY
      - name: Regenerate mechanic registry
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          root = Path.cwd(); sys.path.insert(0, str(root / 'scripts'))
          import grixis_mech as gm
          from grixis_mech import router
          p = root / 'data/grixis/mechanics/modules.json'
          d = json.loads(p.read_text(encoding='utf-8'))
          d['framework_version'] = gm.FRAMEWORK_VERSION
          d['modules'] = gm.registry()
          d['planned_families'] = sorted(k for k in router.PLANNED if k not in gm.MODULES)
          p.write_text(json.dumps(d, indent=1, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - run: python -m pytest -q tests/test_mech_attack_semantics.py tests/test_mech_recursion_semantics.py tests/test_mech_stack_semantics.py tests/test_mech_cost_semantics.py tests/test_mech_tutor_semantics.py tests/test_mech_opponent_semantics.py tests/test_mech_stax_semantics.py
      - run: python scripts/grixis_mechanics.py --check
      - name: Commit audited/generated changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/grixis_mech/stax.py data/grixis/mechanics/modules.json
            git commit -m "Fix symmetric stax-tax grammar and regenerate registry"
            git push origin HEAD:${{ github.head_ref }}
          fi
