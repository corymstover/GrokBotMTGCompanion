name: ChatGPT cycle 91 - corrected 62 deck mana aggregate overlay
on:
  push:
    branches:
      - chatgpt-cycle91-mox-aggregate-overlay
    paths:
      - .github/workflows/chatgpt-cycle91-mox-aggregate.yml
      - scripts/grixis_m6_mox_aggregate_overlay.py
      - tests/test_m6_mox_aggregate_overlay.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cycle91-mox-aggregate
  cancel-in-progress: true
jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle91-mox-aggregate-overlay
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p 'test_m6_mox_aggregate_overlay.py' -v
      - run: python scripts/grixis_m6_mox_aggregate_overlay.py --build --check
      - name: Reject unauthorized or historical edits
        run: |
          if git diff --name-only HEAD | grep -Ev '^data/grixis/m6/mox_reconciliation/' | grep -q .; then
            echo 'Unexpected canonical or Step C mutation'; exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/grixis/m6/mox_reconciliation/aggregate_overlay.json').read_text())
          r=json.loads(Path('data/grixis/registry.json').read_text())
          assert len(r['decks'])==62
          assert r['program']['milestones']['M5']['status']=='accepted'
          assert r['program']['milestones']['M6']['accepted_by'] is None
          assert d['corrected_totals']['fast_mana']==663
          assert d['original_totals']['fast_mana']==638
          assert not any(d['authority'].values())
          PY
      - name: Commit corrected aggregate overlay alone
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/grixis/m6/mox_reconciliation/aggregate_overlay.json
          if git diff --cached --quiet; then
            echo 'aggregate already current'
          else
            git commit -m 'Cycle 91: 62-deck Chrome Mox corrected mana summary overlay [skip ci]'
            git pull --rebase origin chatgpt-cycle91-mox-aggregate-overlay
            git push origin HEAD:chatgpt-cycle91-mox-aggregate-overlay
          fi
