name: "M7 transfer gap inventory — integrity only (NOT certification)"

on:
  pull_request:
    paths:
      - "data/grixis/m7/certification_transfer_repair_2026-10-27.md"
      - ".github/workflows/m7-transfer-repair-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-canonical-transfer-gap-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Confirm immutable October 24 pins and all 14 absent records at the cited main"
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          owner = "corymstover"
          repo = "grixis-commander-encyclopediaGPT"
          pin = "89ef6f71eddf6e18b49b76d0bfb6f82e7f721bc5"
          base = f"https://raw.githubusercontent.com/{owner}/{repo}/{pin}/"

          def fetch(url):
              with urlopen(Request(url, headers={"User-Agent": "Grixis-transfer-audit/1.0"}), timeout=30) as response:
                  return response.read()

          registry = json.loads(fetch(base + "state/current_deck_overrides.json"))['decks']
          prefix = "refinement/verification/m7_certification_transfer/"
          frozen_bytes = fetch(base + prefix + "frozen_approval_snapshot_2026-10-24.json")
          plans_bytes = fetch(base + prefix + "m6_required_cases_2026-10-24.json")
          assert hashlib.sha256(frozen_bytes).hexdigest() == "821468502031359c24ab92acb235ccce22c31299a0fff16a43b3bced6da491b5"
          assert hashlib.sha256(plans_bytes).hexdigest() == "195e2dd6f15aed70cc4384e68d33e200623e34e8f088da939752ea28216dcac8"
          frozen = json.loads(frozen_bytes)['approved_sha256_by_deck']
          required = json.loads(plans_bytes)['decks']
          tree = json.loads(fetch(f"https://api.github.com/repos/{owner}/{repo}/git/trees/{pin}?recursive=1"))
          assert not tree.get('truncated'), "Cannot certify complete file inventory from truncated tree"
          paths = {e['path'] for e in tree['tree']}
          changed = [(name, deck['approved_list_sha256']) for name, deck in registry.items()
                     if deck['approved_list_sha256'] != frozen[name]]
          missing = [(name, sha) for name, sha in changed
                     if f"{prefix}{name}_{sha[:16]}.json" not in paths]
          expected_names = {
              "Nekusar__the_Mindrazer", "Nicol_Bolas", "Nicol_Bolas__the_Ravager",
              "Goben__Gene_Splice_Savant", "Parnesse__the_Subtle_Brush", "RogSi",
              "Saruman__the_White_Hand", "Sauron__Lord_of_the_Rings",
              "Sauron__the_Dark_Lord", "Sedris__the_Traitor_King",
              "Sol_kanar_the_Swamp_King", "Sol_kanar_the_Tainted",
              "Tetsuo_Umezawa", "Tetsuo__Imperial_Champion"
          }
          assert len(registry) == len(frozen) == 62
          assert len(changed) == 28 and len(missing) == 14
          assert {name for name, _ in missing} == expected_names
          assert "Goben__Gene_Splice_Savant" not in required
          assert sum(len(required[n]['required_P0']) for n in expected_names if n in required) == 66

          text = Path('data/grixis/m7/certification_transfer_repair_2026-10-27.md').read_text()
          for name, sha in missing:
              assert name in text and sha[:16] in text, (name, sha)
          print("PASS pinned canonical forensic inventory: 28 post-snapshot approvals, 14 missing attestations, 66 non-Norman planned P0 cases")
          print("NOT A CERTIFICATION PASS: no actual M6 P0/P1 gameplay proof is inferred")
          PY
