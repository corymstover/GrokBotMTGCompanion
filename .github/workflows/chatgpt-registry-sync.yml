name: ChatGPT mechanic registry sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'chatgpt-cycle66-5b-recursion-semantics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCRYFALL_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Regenerate registry
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / 'scripts'))
          import grixis_mech as gm
          from grixis_mech import router
          p = root / 'data/grixis/mechanics/modules.json'
          d = json.loads(p.read_text(encoding='utf-8'))
          d['framework_version'] = gm.FRAMEWORK_VERSION
          d['modules'] = gm.registry()
          d['planned_families'] = sorted(k for k in router.PLANNED if k not in gm.MODULES)
          p.write_text(json.dumps(d, indent=1, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - run: python -m pytest -q tests/test_mech_attack_semantics.py tests/test_mech_recursion_semantics.py
      - run: python scripts/grixis_mechanics.py --check
      - name: Commit registry
        run: |
          if ! git diff --quiet -- data/grixis/mechanics/modules.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/grixis/mechanics/modules.json
            git commit -m "Regenerate mechanic module registry"
            git push origin HEAD:${{ github.head_ref }}
          fi
