name: M7 Deck 40 Nekusar Rev1 exact-source checks

on:
  push:
    branches:
      - chatgpt-m7-nekusar-rev1-20261026
  pull_request:
    paths:
      - 'data/grixis/m7/nekusar_rev1/**'
      - '.github/workflows/m7-nekusar-rev1.yml'
  workflow_dispatch:

jobs:
  finite-commander-rules-and-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-bound finite P0 and P1 checks
        run: python -m unittest discover -v -s data/grixis/m7/nekusar_rev1 -p 'test_nekusar_m7_rev1.py'
