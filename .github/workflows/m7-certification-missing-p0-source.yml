name: M7 exact-approved nine-deck P0 source-bound evidence

on:
  pull_request:
    paths:
      - tests/test_m7_missing_transfer_p0_source_bound.py
      - data/grixis/m7/candidate_lists/Parnesse_the_Subtle_Brush_M7_Rev1_Approved_2026-10-27.txt
      - .github/workflows/m7-certification-missing-p0-source.yml
  workflow_dispatch:

jobs:
  finite-original-p0-cases:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute 46 original M6 P0 cases bound to exact approved 100-card hashes
        run: python3 -m unittest discover -s tests -p 'test_m7_missing_transfer_p0_source_bound.py' -v
