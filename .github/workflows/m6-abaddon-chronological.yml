name: M6 Abaddon chronological paid engine
on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m6-abaddon-chronological.yml
      - scripts/grixis_m6_abaddon_chronological_engine.py
      - tests/test_m6_abaddon_chronological_engine.py
      - data/grixis/m6/phase_b_plans/abaddon_chronological_engine_20261021.json
      - data/grixis/m6/phase_b_bounded/abaddon_chronological_engine_20261021.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chronological-source-paid:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify chronological payment and rules counterexamples
        run: python -m unittest discover -s tests -p 'test_m6_abaddon_chronological_engine.py' -v
      - name: Execute fixed seeded chronological 100-card source-paid experiment
        run: python scripts/grixis_m6_abaddon_chronological_engine.py --out abaddon_chronological_receipt.json
      - name: Prevent false completion claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('abaddon_chronological_receipt.json').read_text())
          p=json.loads(Path('data/grixis/m6/phase_b_plans/abaddon_chronological_engine_20261021.json').read_text())
          m=json.loads(Path('data/grixis/milestone_m6_m7_subtracker.json').read_text())
          assert r['canonical_raw_sha256']==p['canonical_raw_sha256']
          assert all(v is False for v in r['authority'].values())
          assert r['true_multiplayer_win_rate'] is None
          assert r['sufficient_to_recommend_a_swap'] is False
          assert r['m6_certificates_issued']==0
          assert r['m7_approved_decks']==0
          assert not r['full_game_effect_coverage'] and not r['canonical_deck_changed']
          assert m['m6']['gates'][5]['status']=='PARTIAL'
          assert m['m6']['formal_m6_certified_decks']==0
          assert m['m7']['formal_m7_review_decisions']==0
          print('PASS: chronological limited model has no M6/M7 or deck authority.')
          PY
      - name: Publish bounded sample evidence
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-chronological-source-paid
          path: abaddon_chronological_receipt.json
          retention-days: 30
