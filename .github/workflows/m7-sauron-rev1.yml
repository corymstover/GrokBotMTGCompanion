name: M7 Deck 49 Sauron Rev1 source and live Oracle

on:
  pull_request:
    branches: [chatgpt-cycle76-m6-refinement]
    paths:
      - .github/workflows/m7-sauron-rev1.yml
      - data/grixis/m7/sauron_rev1/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sauron-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact review PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and candidate structure
        run: python data/grixis/m7/sauron_rev1/verify_sauron_rev1.py
      - name: Verify live Scryfall Oracle and official Commander legality
        run: python data/grixis/m7/sauron_rev1/verify_sauron_rev1.py --live-scryfall
