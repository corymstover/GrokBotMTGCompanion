name: Phase 7 companion ask (confidence-flagged QA)

on:
  pull_request:
    paths:
      - 'scripts/mv_ask.py'
      - 'scripts/ask_set_atlas.py'
      - 'scripts/ask_rules_evidence.py'
      - 'scripts/historical_set_lookup.py'
      - 'data/set_atlas/**'
      - 'tests/test_mv_ask_set_atlas.py'
      - 'tests/test_mv_ask_rules_evidence.py'
      - 'scripts/commander_rules.py'
      - 'scripts/rules_interactions.py'
      - 'scripts/build_cr_keyword_excerpt.py'
      - 'tests/test_rules_interactions.py'
      - 'data/lore_decks/drafts/*_decklist.txt'
      - 'cards/**'
      - 'data/rules/**'
      - 'tests/test_commander_rules.py'
      - 'tests/test_commander_deck_config_safety.py'
      - 'scripts/query_multiverse_graph.py'
      - 'tests/test_mv_ask.py'
      - 'tests/test_mv_ask_relations.py'
      - 'tests/test_mv_ask_aliases.py'
      - 'tests/test_mv_ask_entity_history.py'
      - 'tests/test_mv_ask_leader_phrasings_b14.py'
      - 'tests/test_mv_ask_kinship_and_leader_rank.py'
      - 'scripts/batch_recount.py'
      - 'tests/test_batch_recount_b9.py'
      - 'data/lore_research/story_coverage_inventory_*.json'
      - 'data/multiverse_graph/**'
      - 'data/card_index.csv'
      - 'data/card_db/**'
      - '.github/workflows/phase7-companion-ask.yml'
  push:
    paths:
      - 'scripts/mv_ask.py'
      - 'scripts/ask_set_atlas.py'
      - 'scripts/ask_rules_evidence.py'
      - 'scripts/historical_set_lookup.py'
      - 'data/set_atlas/**'
      - 'tests/test_mv_ask_set_atlas.py'
      - 'tests/test_mv_ask_rules_evidence.py'
      - 'scripts/commander_rules.py'
      - 'scripts/rules_interactions.py'
      - 'scripts/build_cr_keyword_excerpt.py'
      - 'tests/test_rules_interactions.py'
      - 'data/lore_decks/drafts/*_decklist.txt'
      - 'cards/**'
      - 'data/rules/**'
      - 'tests/test_commander_rules.py'
      - 'tests/test_commander_deck_config_safety.py'
      - 'tests/test_mv_ask.py'
      - 'tests/test_mv_ask_relations.py'
      - 'tests/test_mv_ask_aliases.py'
      - 'tests/test_mv_ask_entity_history.py'
      - 'tests/test_mv_ask_kinship_and_leader_rank.py'
      - 'scripts/batch_recount.py'
      - 'tests/test_batch_recount_b9.py'
      - 'data/lore_research/story_coverage_inventory_*.json'
      - 'data/multiverse_graph/**'
      - '.github/workflows/phase7-companion-ask.yml'
  workflow_dispatch:

jobs:
  companion-ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Representative questions
        run: |
          python3 scripts/mv_ask.py ask "Who is Urza's brother?"
          python3 scripts/mv_ask.py ask "Where did the Golgothian Sylex come from?"
          python3 scripts/mv_ask.py ask "Who killed Elesh Norn?"
          python3 scripts/mv_ask.py ask "Who defeated Ugin?"
          python3 scripts/mv_ask.py ask "How many cards are in Alpha?"
          python3 scripts/mv_ask.py ask "Which sets was Black Lotus printed in?" > /dev/null
          python3 scripts/mv_ask.py ask "How does Urza's Saga interact with Urza's Tower?"
          python3 scripts/mv_ask.py ask "What mechanics does Serra Angel have?" > /dev/null
          python3 scripts/mv_ask.py card "Sol Ring"
          set +e; python3 scripts/mv_ask.py ask "Who is Zorblax the Unreal?"; test $? -eq 3
      - name: Companion tests
        run: python3 -m unittest discover -s tests -p 'test_mv_ask*.py' -v
      - name: Per-batch recount and representative queries
        run: |
          python3 scripts/batch_recount.py
          python3 -m unittest tests.test_batch_recount_b9 -v
      - name: Commander deck-construction rules (CR 2026-09-25)
        run: |
          python3 scripts/commander_rules.py commander "Pir, Imaginative Rascal" "Toothy, Imaginary Friend"
          python3 scripts/commander_rules.py include "Sol Ring" --commander "Urza, Lord High Artificer"
          python3 scripts/commander_rules.py audit-eligibility --check
          python3 -m unittest discover -s tests -p 'test_commander_rules.py' -v
          python3 -m unittest tests.test_commander_deck_config_safety -v
      - name: Gameplay rules-interaction checks (rulings + CR 701/702 excerpt)
        run: |
          python3 scripts/build_cr_keyword_excerpt.py --check
          python3 scripts/rules_interactions.py pair "Urza's Saga" "Urza's Tower" > /dev/null
          python3 scripts/rules_interactions.py audit --check
          python3 -m unittest discover -s tests -p 'test_rules_interactions.py' -v
