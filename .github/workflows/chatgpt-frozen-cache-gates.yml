name: ChatGPT frozen development-cache gates

on:
  push:
    branches: [chatgpt-cycle72-2-frozen-cache-gates]
    paths: [.github/workflows/chatgpt-frozen-cache-gates.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  SCRYFALL_OFFLINE: "1"

jobs:
  gate-f:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-cycle72-2-frozen-cache-gates
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Restore exact frozen development inputs
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request
          files = [
            ("https://data.scryfall.io/oracle-cards/oracle-cards-20261016090200.jsonl.gz", "oracle-cards-20261016090200.jsonl.gz", "ea7abac9906633415553b585b32c4071c79d42ba23d7e3163a0c4e9c265a7483"),
            ("https://data.scryfall.io/rulings/rulings-20261015090033.jsonl.gz", "rulings-20261015090033.jsonl.gz", "3d2dfbd501d1f1b35146e9c57b91121cb6f01f8aa5f88b19c3f28ad31492c85a"),
            ("https://data.scryfall.io/default-cards/default-cards-20261015090541.jsonl.gz", "default-cards-20261015090541.jsonl.gz", "f902a9a655c9854f535a8f02b1374540c564e31ef405ec8325acb2adbb6672f8"),
          ]
          d = pathlib.Path('.cache'); d.mkdir(exist_ok=True)
          for url, name, want in files:
              p = d / name
              urllib.request.urlretrieve(url, p)
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              if got != want:
                  raise SystemExit(f"HASH MISMATCH {name}: {got}")
              print("restored+verified", name, p.stat().st_size)
          PY
          python scripts/check_dev_snapshot_lock.py

      - name: Verify closed E C D prerequisites
        run: |
          python scripts/grixis_mechanics.py --check
          python scripts/grixis_mana_step.py --check
          python scripts/grixis_commander_step.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/grixis/upgrade_plan.json').read_text())
          state={s['id']:s['status'] for s in d['steps']}
          for step in ('E','C','D'):
              if state.get(step)!='complete':
                  raise SystemExit(f'{step} prerequisite is not complete: {state.get(step)}')
          print('E/C/D prerequisite states:', {k:state[k] for k in ('E','C','D')})
          PY

      - name: Execute and close Step F on frozen canonical decks
        run: |
          python scripts/grixis_bracket_mechanics.py --build
          python scripts/grixis_bracket_mechanics.py --check
          python scripts/grixis_bracket_stress_runner.py --build
          python scripts/grixis_bracket_stress_runner.py --check
          python scripts/grixis_bracket_stress_gain.py --build
          python scripts/grixis_bracket_stress_gain.py --check
          python scripts/grixis_stress_step.py --check
          python -m pytest -q tests/test_bracket_stress.py tests/test_bracket_stress_runner.py tests/test_bracket_stress_step.py tests/test_bracket_red_team.py tests/test_bracket_mechanics.py tests/test_mech_stack_semantics.py tests/test_mech_stax_semantics.py
          python scripts/validate_all.py --only dev-snapshot-lock,mechanics,mana-step,commander-step,bracket-stress-step

      - name: Mark F complete and checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/grixis/upgrade_plan.json'); d=json.loads(p.read_text())
          for s in d['steps']:
              if s['id']=='F':
                  s['status']='complete'
                  s['completed']='ChatGPT cycle 72.5 frozen-cache validation'
          lt=d['launch_tracker']
          for s in lt['stages']:
              if s['id']=='F':
                  s['batches_done']=s['estimated_batches']
                  s['status']='complete'
                  s['note']='62-deck bracket stress/routing/red-team architecture closed; all B5 Step-E mechanic items executed on frozen canonical decks with hash/snapshot provenance; judgment prompts remain human-only.'
          lt['batches_done']=sum(float(s['batches_done']) for s in lt['stages'])
          lt['percent_complete']=round(100*lt['batches_done']/lt['total_estimated_batches'],1)
          lt['updated']='ChatGPT cycle 72.5 (2026-10-17)'
          if lt['percent_complete'] != 71.2:
              raise SystemExit(f"unexpected launch tracker after F closure: {lt['percent_complete']}")
          p.write_text(json.dumps(d,indent=1,ensure_ascii=False)+"\n")
          print('launch',lt['percent_complete'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grixis/bracket_stress_mechanics data/grixis/bracket_stress_packets data/grixis/bracket_stress_gain.json data/grixis/upgrade_plan.json
          git commit -m "ChatGPT cycle 72.5: close Step F frozen-cache gate [skip ci]"
          git push origin HEAD:chatgpt-cycle72-2-frozen-cache-gates
